name: PlayZone Windows Runtime build

on:
  push:
    branches:
      - release/v028-local-service
    paths:
      - "local-service-test/requirements-portable.txt"
      - ".github/workflows/local-service-runtime-build.yml"
  workflow_dispatch:

jobs:
  runtime:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build self-contained embedded Python runtime
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'
          $PyVersion = '3.12.6'
          $build = Join-Path $env:GITHUB_WORKSPACE 'local-service-test\build'
          $runtimeRoot = Join-Path $build '.runtime'
          $runtime = Join-Path $runtimeRoot 'python'
          $downloads = Join-Path $build 'downloads'
          New-Item -ItemType Directory -Force -Path $runtime,$downloads | Out-Null

          $zip = Join-Path $downloads 'python-embed.zip'
          $getPip = Join-Path $downloads 'get-pip.py'
          Invoke-WebRequest -UseBasicParsing -Uri "https://www.python.org/ftp/python/$PyVersion/python-$PyVersion-embed-amd64.zip" -OutFile $zip
          Expand-Archive -LiteralPath $zip -DestinationPath $runtime -Force

          New-Item -ItemType Directory -Force -Path (Join-Path $runtime 'Lib\site-packages') | Out-Null
          @(
            'python312.zip'
            '.'
            'Lib'
            'Lib\site-packages'
            '..\..\backend'
            'import site'
          ) | Set-Content -LiteralPath (Join-Path $runtime 'python312._pth') -Encoding ASCII

          Invoke-WebRequest -UseBasicParsing -Uri 'https://bootstrap.pypa.io/get-pip.py' -OutFile $getPip
          & (Join-Path $runtime 'python.exe') $getPip --disable-pip-version-check --no-warn-script-location
          if ($LASTEXITCODE -ne 0) { throw "get-pip failed: $LASTEXITCODE" }

          & (Join-Path $runtime 'python.exe') -m pip install --disable-pip-version-check --no-warn-script-location -r 'local-service-test\requirements-portable.txt'
          if ($LASTEXITCODE -ne 0) { throw "dependency install failed: $LASTEXITCODE" }

          & (Join-Path $runtime 'python.exe') -c "import fastapi,uvicorn,sqlalchemy,pydantic,httpx,argon2,tzdata; print('RUNTIME_OK')"
          if ($LASTEXITCODE -ne 0) { throw "runtime import test failed: $LASTEXITCODE" }

          Remove-Item -Recurse -Force (Join-Path $runtime 'Lib\site-packages\pip') -ErrorAction SilentlyContinue
          Get-ChildItem (Join-Path $runtime 'Lib\site-packages') -Directory -Filter 'pip-*.dist-info' -ErrorAction SilentlyContinue | Remove-Item -Recurse -Force
          Remove-Item -Recurse -Force (Join-Path $runtime 'Scripts') -ErrorAction SilentlyContinue
          Set-Content -LiteralPath (Join-Path $runtimeRoot 'READY-v0.28.txt') -Value "PlayZone v0.28 local service Windows runtime ready" -Encoding ASCII

      - name: Validate embedded runtime after cleanup
        shell: powershell
        run: |
          $python = 'local-service-test\build\.runtime\python\python.exe'
          & $python -c "import fastapi,uvicorn,sqlalchemy,pydantic,httpx,argon2,tzdata; print('RUNTIME_FINAL_OK')"
          if ($LASTEXITCODE -ne 0) { throw 'final embedded runtime validation failed' }

      - name: Smoke test service with the exact embedded runtime layout
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $smoke = Join-Path $env:RUNNER_TEMP 'PlayZone Manager'
          $serviceDir = Join-Path $smoke 'service'
          $runtimeDir = Join-Path $smoke 'runtime'
          $backend = Join-Path $runtimeDir 'backend'
          New-Item -ItemType Directory -Force -Path $serviceDir,$runtimeDir,$backend | Out-Null
          Copy-Item -Recurse -Force 'local-service-test\build\.runtime' $runtimeDir

          $csc = "$env:WINDIR\Microsoft.NET\Framework64\v4.0.30319\csc.exe"
          & $csc /nologo /target:exe /optimize+ /out:"$serviceDir\PlayZoneManager.Service.exe" /reference:System.ServiceProcess.dll 'local-service-test\PlayZoneManager.Service.cs'
          if ($LASTEXITCODE -ne 0) { throw 'service compile failed' }

          @'
          import json
          import os
          import threading
          import time
          from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer

          stop_file = os.environ["PLAYZONE_SERVICE_STOP_FILE"]
          class H(BaseHTTPRequestHandler):
              def do_GET(self):
                  if self.path == "/api/health":
                      body = json.dumps({"ok": True, "runtime_mode": os.environ.get("PLAYZONE_RUNTIME_MODE")}).encode()
                      self.send_response(200)
                      self.send_header("Content-Type", "application/json")
                      self.send_header("Content-Length", str(len(body)))
                      self.end_headers()
                      self.wfile.write(body)
                  else:
                      self.send_response(404); self.end_headers()
              def log_message(self, *args):
                  pass

          server = ThreadingHTTPServer(("127.0.0.1", 8000), H)
          def watch():
              while not os.path.exists(stop_file):
                  time.sleep(0.2)
              server.shutdown()
          threading.Thread(target=watch, daemon=True).start()
          server.serve_forever()
          '@ | Set-Content -Encoding UTF8 (Join-Path $backend 'service_runner.py')

          $name = 'PlayZoneManager'
          $old = Get-Service -Name $name -ErrorAction SilentlyContinue
          if ($old) {
            Stop-Service $name -Force -ErrorAction SilentlyContinue
            sc.exe delete $name | Out-Null
            Start-Sleep -Seconds 2
          }
          New-Service -Name $name -BinaryPathName ('"{0}"' -f (Join-Path $serviceDir 'PlayZoneManager.Service.exe')) -DisplayName 'PlayZone Manager Service' -StartupType Automatic | Out-Null
          sc.exe failure $name reset= 86400 actions= restart/1000/restart/1000/restart/1000 | Out-Null
          Start-Service $name

          function Wait-Health {
            $deadline = (Get-Date).AddSeconds(30)
            while ((Get-Date) -lt $deadline) {
              try {
                $h = Invoke-RestMethod -TimeoutSec 1 http://127.0.0.1:8000/api/health
                if ($h.ok -eq $true -and $h.runtime_mode -eq 'WINDOWS_SERVICE') { return $true }
              } catch {}
              Start-Sleep -Milliseconds 500
            }
            return $false
          }

          if (-not (Wait-Health)) {
            Get-Content "$env:ProgramData\PlayZone Manager\logs\service-host.log" -Tail 100 -ErrorAction SilentlyContinue
            throw 'combined embedded-runtime service health failed'
          }
          Stop-Service $name
          (Get-Service $name).WaitForStatus('Stopped', (New-TimeSpan -Seconds 30))
          Start-Service $name
          if (-not (Wait-Health)) { throw 'combined embedded-runtime service restart failed' }

      - name: Cleanup combined service smoke
        if: always()
        shell: powershell
        run: |
          Stop-Service PlayZoneManager -Force -ErrorAction SilentlyContinue
          sc.exe delete PlayZoneManager 2>$null | Out-Null
          Remove-Item -Recurse -Force "$env:ProgramData\PlayZone Manager" -ErrorAction SilentlyContinue

      - name: Publish embedded runtime
        uses: actions/upload-artifact@v4
        with:
          name: PlayZoneManager-PythonRuntime-win-x64
          path: local-service-test/build/.runtime
          include-hidden-files: true
          if-no-files-found: error
