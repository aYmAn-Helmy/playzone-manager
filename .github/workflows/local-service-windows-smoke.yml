name: PlayZone Windows Service smoke

on:
  push:
    branches:
      - release/v028-local-service
    paths:
      - "local-service-test/**"
      - ".github/workflows/local-service-windows-smoke.yml"
  workflow_dispatch:

jobs:
  windows-service:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile service host
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $csc = "$env:WINDIR\Microsoft.NET\Framework64\v4.0.30319\csc.exe"
          if (-not (Test-Path $csc)) { throw "csc.exe not found" }
          New-Item -ItemType Directory -Force -Path "$env:RUNNER_TEMP\pz-service\service" | Out-Null
          & $csc /nologo /target:exe /optimize+ /out:"$env:RUNNER_TEMP\pz-service\service\PlayZoneManager.Service.exe" /reference:System.ServiceProcess.dll "local-service-test\PlayZoneManager.Service.cs"
          if ($LASTEXITCODE -ne 0) { throw "service compile failed" }

      - name: Publish compiled service host
        uses: actions/upload-artifact@v4
        with:
          name: PlayZoneManager-Service-win-x64
          path: ${{ runner.temp }}\pz-service\service\PlayZoneManager.Service.exe
          if-no-files-found: error

      - name: Prepare fake PlayZone runtime
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $root = "$env:RUNNER_TEMP\pz-service"
          $runtime = Join-Path $root 'runtime'
          $backend = Join-Path $runtime 'backend'
          $pythonDir = Join-Path $runtime '.runtime\python'
          New-Item -ItemType Directory -Force -Path $backend,(Split-Path $pythonDir) | Out-Null
          $pyRoot = python -c "import sys; print(sys.prefix)"
          New-Item -ItemType Junction -Path $pythonDir -Target $pyRoot | Out-Null
          @'
          import json
          import os
          import threading
          import time
          from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer

          stop_file = os.environ["PLAYZONE_SERVICE_STOP_FILE"]

          class H(BaseHTTPRequestHandler):
              def do_GET(self):
                  if self.path == "/api/health":
                      body = json.dumps({"ok": True, "runtime_mode": os.environ.get("PLAYZONE_RUNTIME_MODE")}).encode()
                      self.send_response(200)
                      self.send_header("Content-Type", "application/json")
                      self.send_header("Content-Length", str(len(body)))
                      self.end_headers()
                      self.wfile.write(body)
                  else:
                      self.send_response(404)
                      self.end_headers()
              def log_message(self, *args):
                  pass

          server = ThreadingHTTPServer(("127.0.0.1", 8000), H)

          def watch():
              while not os.path.exists(stop_file):
                  time.sleep(0.2)
              server.shutdown()

          threading.Thread(target=watch, daemon=True).start()
          server.serve_forever()
          '@ | Set-Content -Encoding UTF8 (Join-Path $backend 'service_runner.py')

      - name: Install, start, stop and restart real Windows Service
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $root = "$env:RUNNER_TEMP\pz-service"
          $exe = Join-Path $root 'service\PlayZoneManager.Service.exe'
          $name = 'PlayZoneManager'
          $old = Get-Service -Name $name -ErrorAction SilentlyContinue
          if ($old) {
            Stop-Service $name -Force -ErrorAction SilentlyContinue
            sc.exe delete $name | Out-Null
            Start-Sleep -Seconds 2
          }
          New-Service -Name $name -BinaryPathName ('"{0}"' -f $exe) -DisplayName 'PlayZone Manager Service' -StartupType Automatic | Out-Null
          sc.exe failure $name reset= 86400 actions= restart/1000/restart/1000/restart/1000 | Out-Null
          Start-Service $name

          $deadline = (Get-Date).AddSeconds(30)
          $ok = $false
          while ((Get-Date) -lt $deadline) {
            try {
              $r = Invoke-RestMethod -TimeoutSec 1 http://127.0.0.1:8000/api/health
              if ($r.ok -eq $true -and $r.runtime_mode -eq 'WINDOWS_SERVICE') { $ok = $true; break }
            } catch {}
            Start-Sleep -Milliseconds 500
          }
          if (-not $ok) {
            Get-Content "$env:ProgramData\PlayZone Manager\logs\service-host.log" -Tail 100 -ErrorAction SilentlyContinue
            throw "health check failed after service start"
          }

          Stop-Service $name
          (Get-Service $name).WaitForStatus('Stopped', (New-TimeSpan -Seconds 30))
          $stopped = $false
          try { Invoke-RestMethod -TimeoutSec 1 http://127.0.0.1:8000/api/health | Out-Null } catch { $stopped = $true }
          if (-not $stopped) { throw "child HTTP process remained alive after service stop" }

          Start-Service $name
          $deadline = (Get-Date).AddSeconds(30)
          $ok = $false
          while ((Get-Date) -lt $deadline) {
            try {
              $r = Invoke-RestMethod -TimeoutSec 1 http://127.0.0.1:8000/api/health
              if ($r.ok -eq $true) { $ok = $true; break }
            } catch {}
            Start-Sleep -Milliseconds 500
          }
          if (-not $ok) { throw "health check failed after service restart" }

      - name: Cleanup
        if: always()
        shell: powershell
        run: |
          $name = 'PlayZoneManager'
          Stop-Service $name -Force -ErrorAction SilentlyContinue
          sc.exe delete $name 2>$null | Out-Null
          Remove-Item -Recurse -Force "$env:ProgramData\PlayZone Manager" -ErrorAction SilentlyContinue
