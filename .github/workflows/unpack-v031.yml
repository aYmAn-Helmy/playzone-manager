name: Unpack PlayZone v0.31 source

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/unpack-v031.yml"

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct and unpack v0.31 source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/playzone-v031
          python - <<'PY'
          import base64
          import glob
          from pathlib import Path

          parts = sorted(glob.glob("releases/v0.31/source.tar.xz.b64.part*"))
          if not parts:
              raise SystemExit("No v0.31 source bundle parts found")
          import lzma
          chunks = ["".join(Path(p).read_text(encoding="utf-8").split()) for p in parts]
          encoded = "".join(chunks)
          try:
              archive = base64.b64decode(encoded, validate=True)
              lzma.decompress(archive)
          except Exception:
              if len(chunks) <= 2 or len(chunks[2]) != 18001:
                  raise
              prefix = "".join(chunks[:2])
              bad = chunks[2]
              suffix = "".join(chunks[3:])
              archive = None
              for i in range(len(bad)):
                  candidate = prefix + bad[:i] + bad[i + 1:] + suffix
                  try:
                      decoded = base64.b64decode(candidate, validate=True)
                      lzma.decompress(decoded)
                  except Exception:
                      if i and i % 2000 == 0:
                          print(f"Checked {i} repair positions...")
                      continue
                  print(f"Repaired corrupted base64 chunk at part02 character {i}")
                  archive = decoded
                  break
              if archive is None:
                  raise SystemExit("Could not repair v0.31 source bundle")
          Path("/tmp/playzone-v031/source.tar.xz").write_bytes(archive)
          PY
          xz -t /tmp/playzone-v031/source.tar.xz
          mkdir -p /tmp/playzone-v031/extracted
          tar -xJf /tmp/playzone-v031/source.tar.xz -C /tmp/playzone-v031/extracted

          mapfile -t top_entries < <(find /tmp/playzone-v031/extracted -mindepth 1 -maxdepth 1 -printf '%p\n')
          src="/tmp/playzone-v031/extracted"
          if [ "${#top_entries[@]}" -eq 1 ] && [ -d "${top_entries[0]}" ]; then
            src="${top_entries[0]}"
          fi

          rsync -a "${src}/" ./

          test -f VERSION.txt
          grep -qx "0.31" VERSION.txt
          test -f backend/app/main.py
          test -f backend/app/tailscale_support.py
          test -f frontend/dist/assets/index-v031.js
          test -f Setup-Root-Password.bat
          test -f Setup-Tailscale-Support.bat

      - name: Commit unpacked v0.31 source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm --ignore-unmatch .github/workflows/unpack-v031.yml
          git add -A
          if git diff --cached --quiet; then
            echo "No source changes to commit."
            exit 0
          fi
          git commit -m "Unpack PlayZone Manager v0.31 source"
          git push origin HEAD:main
