name: Hydrate v0.33 offline runtime from verified checksums

on:
  push:
    branches: [abo_aYmAn]
    paths:
      - ".github/workflows/hydrate-v033-runtime.yml"

permissions:
  contents: write

jobs:
  hydrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download exact offline runtime payloads
        shell: python
        run: |
          from pathlib import Path
          import hashlib, json, urllib.request

          root = Path("offline-runtime")
          root.mkdir(parents=True, exist_ok=True)
          (root / "wheels").mkdir(parents=True, exist_ok=True)

          expected = {}
          for line in (root / "SHA256SUMS.txt").read_text(encoding="utf-8").splitlines():
              if not line.strip():
                  continue
              digest, rel = line.split(None, 1)
              expected[rel.strip()] = digest.strip().lower()

          def download(url, target):
              print("Downloading", target, "from", url)
              with urllib.request.urlopen(url, timeout=120) as r:
                  data = r.read()
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes(data)
              got = hashlib.sha256(data).hexdigest()
              want = expected[str(target.relative_to(root)).replace("\\", "/")]
              if got != want:
                  target.unlink(missing_ok=True)
                  raise RuntimeError(f"SHA256 mismatch for {target}: {got} != {want}")

          py = root / "python-3.12.6-embed-amd64.zip"
          if not py.exists():
              download("https://www.python.org/ftp/python/3.12.6/python-3.12.6-embed-amd64.zip", py)

          gp = root / "get-pip.py"
          if not gp.exists():
              urls = [
                  "https://bootstrap.pypa.io/get-pip.py",
                  "https://bootstrap.pypa.io/pip/3.12/get-pip.py",
              ]
              last = None
              for url in urls:
                  try:
                      download(url, gp)
                      last = None
                      break
                  except Exception as exc:
                      last = exc
              if last:
                  raise last

          projects = {
              "annotated_doc-0.0.5-py3-none-any.whl": ("annotated-doc", "0.0.5"),
              "annotated_types-0.8.0-py3-none-any.whl": ("annotated-types", "0.8.0"),
              "anyio-4.15.1-py3-none-any.whl": ("anyio", "4.15.1"),
              "argon2_cffi-25.1.0-py3-none-any.whl": ("argon2-cffi", "25.1.0"),
              "argon2_cffi_bindings-26.1.0-cp310-abi3-win_amd64.whl": ("argon2-cffi-bindings", "26.1.0"),
              "certifi-2026.7.22-py3-none-any.whl": ("certifi", "2026.7.22"),
              "cffi-2.1.1-cp312-cp312-win_amd64.whl": ("cffi", "2.1.1"),
              "click-8.5.0-py3-none-any.whl": ("click", "8.5.0"),
              "fastapi-0.141.1-py3-none-any.whl": ("fastapi", "0.141.1"),
              "greenlet-3.5.6-cp312-cp312-win_amd64.whl": ("greenlet", "3.5.6"),
              "h11-0.16.0-py3-none-any.whl": ("h11", "0.16.0"),
              "httpcore-1.0.9-py3-none-any.whl": ("httpcore", "1.0.9"),
              "httpx-0.28.1-py3-none-any.whl": ("httpx", "0.28.1"),
              "idna-3.20-py3-none-any.whl": ("idna", "3.20"),
              "pip-25.2-py3-none-any.whl": ("pip", "25.2"),
              "pycparser-3.0-py3-none-any.whl": ("pycparser", "3.0"),
              "pydantic-2.13.5-py3-none-any.whl": ("pydantic", "2.13.5"),
              "pydantic_core-2.46.5-cp312-cp312-win_amd64.whl": ("pydantic-core", "2.46.5"),
              "pywin32-311-cp312-cp312-win_amd64.whl": ("pywin32", "311"),
              "sqlalchemy-2.0.54-cp312-cp312-win_amd64.whl": ("SQLAlchemy", "2.0.54"),
              "starlette-1.7.0-py3-none-any.whl": ("starlette", "1.7.0"),
              "typing_extensions-4.16.0-py3-none-any.whl": ("typing-extensions", "4.16.0"),
              "typing_inspection-0.4.4-py3-none-any.whl": ("typing-inspection", "0.4.4"),
              "tzdata-2026.4-py2.py3-none-any.whl": ("tzdata", "2026.4"),
              "uvicorn-0.53.0-py3-none-any.whl": ("uvicorn", "0.53.0"),
          }

          for filename, (project, version) in projects.items():
              target = root / "wheels" / filename
              if target.exists():
                  continue
              api = f"https://pypi.org/pypi/{project}/{version}/json"
              with urllib.request.urlopen(api, timeout=60) as r:
                  meta = json.load(r)
              match = next((u for u in meta.get("urls", []) if u.get("filename") == filename), None)
              if not match:
                  raise RuntimeError(f"PyPI file not found: {filename}")
              download(match["url"], target)

          for rel, want in expected.items():
              p = root / rel
              if not p.is_file():
                  raise RuntimeError(f"Missing expected runtime file: {rel}")
              got = hashlib.sha256(p.read_bytes()).hexdigest()
              if got != want:
                  raise RuntimeError(f"Checksum mismatch after hydration: {rel}")

          print(f"Verified {len(expected)} offline runtime files.")

      - name: Commit exact runtime payload
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/hydrate-v033-runtime.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add offline-runtime .github/workflows/hydrate-v033-runtime.yml
          git commit -m "Add complete verified v0.33 offline runtime"
          git push origin HEAD:abo_aYmAn
