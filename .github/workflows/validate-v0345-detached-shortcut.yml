name: Validate v0.34.5 Detached Launch and Shortcuts

on:
  push:
    branches:
      - fix/v0345-detached-launch-shortcut
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Validate source
        shell: pwsh
        run: |
          $tokens=$null; $errors=$null
          [System.Management.Automation.Language.Parser]::ParseFile('Install-PlayZone-Service.ps1',[ref]$tokens,[ref]$errors) | Out-Null
          if ($errors.Count) { throw $errors[0].Message }
          if ((Get-Content VERSION.txt -Raw).Trim() -ne '0.34.5') { throw 'Expected 0.34.5' }
          $installer = Get-Content Install-PlayZone-Service.ps1 -Raw
          foreach ($needle in @(
            "Get-CimInstance Win32_Process -Filter ""Name='explorer.exe'""",
            'Win32_UserProfile',
            "Join-Path \$env:PUBLIC 'Desktop'",
            '$PrimaryDesktopShortcut',
            'explorer.exe'
          )) {
            if (-not $installer.Contains($needle)) { throw "Installer marker missing: $needle" }
          }

      - name: Install host validation dependencies
        shell: pwsh
        run: python -m pip install -r backend/requirements.txt

      - name: Prepare fresh install and root password
        shell: pwsh
        run: |
          $installRoot = Join-Path $env:ProgramFiles 'PlayZone Manager'
          $dataRoot = Join-Path $env:ProgramData 'PlayZone Manager'
          Stop-Service PlayZoneManager -Force -ErrorAction SilentlyContinue
          & sc.exe delete PlayZoneManager 2>$null | Out-Null
          Remove-Item $installRoot -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item $dataRoot -Recurse -Force -ErrorAction SilentlyContinue

          $secure = Join-Path $dataRoot 'secure-data'
          New-Item -ItemType Directory -Force -Path $secure | Out-Null
          $env:PLAYZONE_DB_PATH = Join-Path $secure 'playzone.db'
          Push-Location backend
          'Root-Shortcut-Test-123!' | python -m app.root_setup set
          if ($LASTEXITCODE -ne 0) { throw 'ROOT preconfiguration failed.' }
          Pop-Location

      - name: Bundle Electron for offline install
        shell: pwsh
        run: |
          $dir = Join-Path $PWD 'desktop-runtime'
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          $name='electron-v44.4.5-win32-x64.zip'
          $dest=Join-Path $dir $name
          Invoke-WebRequest -UseBasicParsing -Uri "https://github.com/electron/electron/releases/download/v44.4.5/$name" -OutFile $dest
          $hash=(Get-FileHash $dest -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne '11c395820a5aaa8ebcc0686b476d0ac98a730274ebfbdc8cf5538a7c2815cb5d') { throw "Electron hash mismatch: $hash" }

      - name: Install PlayZone
        shell: pwsh
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\Install-PlayZone-Service.ps1 -NonInteractive
          if ($LASTEXITCODE -ne 0) { throw "Installer failed: $LASTEXITCODE" }

          $publicShortcut = Join-Path $env:PUBLIC 'Desktop\PlayZone Manager.lnk'
          if (-not (Test-Path -LiteralPath $publicShortcut)) { throw "Public desktop shortcut missing: $publicShortcut" }

          $wsh=New-Object -ComObject WScript.Shell
          $lnk=$wsh.CreateShortcut($publicShortcut)
          $expected=Join-Path $env:ProgramFiles 'PlayZone Manager\desktop-runtime\PlayZone Manager.exe'
          if ($lnk.TargetPath -ne $expected) { throw "Shortcut target mismatch: $($lnk.TargetPath)" }

          $startMenu = Join-Path ([Environment]::GetFolderPath('CommonPrograms')) 'PlayZone Manager.lnk'
          if (-not (Test-Path -LiteralPath $startMenu)) { throw "Start menu shortcut missing: $startMenu" }

          $svc=Get-Service PlayZoneManager
          if ($svc.Status -ne 'Running') { throw "Service not running: $($svc.Status)" }
          Write-Host 'INSTALL_AND_SHORTCUTS_OK'

      - name: Launch through Windows Explorer shortcut
        shell: pwsh
        run: |
          Get-Process -Name 'PlayZone Manager' -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          $publicShortcut = Join-Path $env:PUBLIC 'Desktop\PlayZone Manager.lnk'
          Start-Process -FilePath "$env:WINDIR\explorer.exe" -ArgumentList @('"' + $publicShortcut + '"')
          $ok=$false
          for($i=0;$i -lt 40;$i++){
            Start-Sleep -Milliseconds 500
            if(Get-Process -Name 'PlayZone Manager' -ErrorAction SilentlyContinue){$ok=$true;break}
          }
          if(-not $ok){throw 'PlayZone Manager did not start through Explorer shortcut.'}
          Write-Host 'EXPLORER_SHORTCUT_LAUNCH_OK'

      - name: Verify app survives previous shell step
        shell: pwsh
        run: |
          $p=Get-Process -Name 'PlayZone Manager' -ErrorAction SilentlyContinue
          if(-not $p){throw 'PlayZone Manager exited when the previous shell step ended.'}
          $svc=Get-Service PlayZoneManager
          if($svc.Status -ne 'Running'){throw 'Service stopped unexpectedly.'}
          $health=Invoke-RestMethod http://127.0.0.1:8000/api/health -TimeoutSec 5
          if(-not $health.ok){throw 'Health check failed.'}
          Write-Host 'DETACHED_PROCESS_SURVIVED_OK'

      - name: Uninstall test
        shell: pwsh
        run: |
          $installRoot=Join-Path $env:ProgramFiles 'PlayZone Manager'
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File (Join-Path $installRoot 'Uninstall-PlayZone-Service.ps1') -RemoveData
          if($LASTEXITCODE -ne 0){throw "Uninstall failed: $LASTEXITCODE"}
          if(Get-Service PlayZoneManager -ErrorAction SilentlyContinue){throw 'Service remains after uninstall.'}
          if(Test-Path $installRoot){throw 'InstallRoot remains after uninstall.'}
          Write-Host 'UNINSTALL_OK'
