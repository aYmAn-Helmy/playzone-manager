name: SaaS core tests

on:
  push:
    branches: [saas-v1]
    paths:
      - "saas/**"
      - ".github/workflows/saas-core-tests.yml"
  pull_request:
    paths:
      - "saas/**"
      - ".github/workflows/saas-core-tests.yml"

jobs:
  cloud:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: saas/cloud
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: PYTHONPATH=. pytest -q

  edge:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: saas/edge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: PYTHONPATH=. pytest -q
      - run: python -m py_compile integration/v027_edge_runtime.py integration/v027_edge_commands.py integration/apply_to_v027.py

  desktop:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: saas/desktop/PlayZoneManager.Desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - run: dotnet restore
      - run: dotnet build -c Release --no-restore
      - run: dotnet publish -c Release -r win-x64 --self-contained false --no-restore -o publish
      - uses: actions/upload-artifact@v4
        with:
          name: PlayZoneManager-Desktop-win-x64
          path: saas/desktop/PlayZoneManager.Desktop/publish/**
