name: Build PlayZone offline Windows runtime

on:
  push:
    branches: [service-v027]
  workflow_dispatch:

jobs:
  runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare offline runtime payload
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p offline/wheels
          curl -fL --retry 5 --retry-delay 2             -o offline/python-3.12.6-embed-amd64.zip             https://www.python.org/ftp/python/3.12.6/python-3.12.6-embed-amd64.zip
          curl -fL --retry 5 --retry-delay 2             -o offline/get-pip.py             https://bootstrap.pypa.io/get-pip.py
          cat > offline/requirements-offline.txt <<'REQ'
          fastapi==0.141.1
          uvicorn==0.53.0
          sqlalchemy==2.0.54
          pydantic==2.13.5
          httpx==0.28.1
          tzdata==2026.4
          argon2-cffi==25.1.0
          pywin32==311
          pip==25.2
          REQ
          python -m pip install --upgrade pip
          python -m pip download             --dest offline/wheels             --only-binary=:all:             --platform win_amd64             --implementation cp             --python-version 312             --abi cp312             -r offline/requirements-offline.txt
          python - <<'PY'
          from pathlib import Path
          import hashlib
          root=Path('offline')
          files=sorted(p for p in root.rglob('*') if p.is_file())
          with (root/'SHA256SUMS.txt').open('w',encoding='utf-8') as f:
              for p in files:
                  h=hashlib.sha256(p.read_bytes()).hexdigest()
                  f.write(f"{h}  {p.relative_to(root).as_posix()}\n")
          print("files", len(files))
          PY
          ls -lh offline offline/wheels
      - uses: actions/upload-artifact@v4
        with:
          name: PlayZone-v027-offline-windows-runtime
          path: offline
          retention-days: 30
