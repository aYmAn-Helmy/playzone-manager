name: Validate PlayZone v0.33.1 UI Interaction Fixes

on:
  push:
    branches:
      - fix/ui2-interactions
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python and JavaScript syntax
        shell: pwsh
        run: |
          python -m py_compile backend/app/main.py backend/app/embedded_voltra.py backend/voltra_local/dashboard.py
          node --check frontend/dist/playzone-responsive.js
          node --check frontend/dist/assets/index-v031.js
          node --check desktop-shell/main.js

      - name: Install backend validation dependencies
        shell: pwsh
        run: |
          python -m pip install -r backend/requirements.txt

      - name: Validate direct internal Voltra page
        shell: pwsh
        run: |
          @'
          from app.main import _embedded_voltra_console_html
          h = _embedded_voltra_console_html()
          assert "playzone_token" in h
          assert "/api/root/voltra-console" in h
          assert "Voltra API Token" not in h
          assert 'href="/"' in h
          assert "العودة إلى PlayZone" in h
          assert '<button class="tab active"' in h
          print("voltra-page-ok")
          '@ | Set-Content backend/validate_voltra_page.py -Encoding UTF8
          Push-Location backend
          python validate_voltra_page.py
          Pop-Location

      - name: Install jsdom
        shell: pwsh
        run: |
          npm install --no-save jsdom@27

      - name: Test privacy eye and internal navigation DOM behavior
        shell: pwsh
        run: |
          @'
          const fs = require('fs');
          const { JSDOM } = require('jsdom');

          const html = `<!doctype html><html><body>
            <div class="stats">
              <div class="stat orange"><div class="stat-icon"></div><div><span>إجمالي الإيرادات اليوم</span><strong>123.45 ج.م</strong></div></div>
              <div class="stat violet"><div class="stat-icon"></div><div><span>ساعات اللعب اليوم</span><strong>12:34:56</strong></div></div>
            </div>
            <section class="content-section">
              <a class="button ghost" href="http://127.0.0.1:8086/voltra" target="_blank">لوحة Voltra</a>
            </section>
            <aside class="sidebar"><button class="nav-item selected">الطاقة / Voltra</button></aside>
          </body></html>`;

          const dom = new JSDOM(html, {
            url: 'http://127.0.0.1:8000/',
            runScripts: 'outside-only',
            pretendToBeVisual: true
          });
          const { window } = dom;
          window.matchMedia = () => ({ matches:false, addEventListener(){} });
          window.requestAnimationFrame = (cb) => { cb(); return 1; };
          window.HTMLElement.prototype.scrollIntoView = function(){};
          window.eval(fs.readFileSync('frontend/dist/playzone-responsive.js','utf8'));

          const tick = () => new Promise(r => setTimeout(r, 20));
          (async () => {
            await tick();

            const eye = window.document.querySelector('.pz-privacy-toggle');
            if (!eye) throw new Error('privacy eye not created');

            const values = [...window.document.querySelectorAll('.stats .stat strong')];
            if (values[0].textContent.trim() !== '123.45 ج.م') throw new Error('revenue changed before click');
            if (values[1].textContent.trim() !== '12:34:56') throw new Error('gameplay changed before click');

            eye.click();
            await tick();
            if (values[0].textContent.trim() !== '••••••') throw new Error('revenue did not hide');
            if (values[1].textContent.trim() !== '••••••') throw new Error('gameplay did not hide');

            eye.click();
            await tick();
            if (values[0].textContent.trim() !== '123.45 ج.م') throw new Error('revenue did not restore');
            if (values[1].textContent.trim() !== '12:34:56') throw new Error('gameplay did not restore');

            const voltra = window.document.querySelector('a.button.ghost');
            if (!voltra || !voltra.href.endsWith('/voltra-console')) throw new Error('Voltra link not converted to internal page');
            if (voltra.target) throw new Error('Voltra still targets external window');

            if (!window.document.getElementById('pz-left-scroll-track')) throw new Error('left scrollbar not created');

            console.log('dom-interactions-ok');
          })().catch(err => { console.error(err); process.exit(1); });
          '@ | Set-Content ui-test.cjs -Encoding UTF8

          node ui-test.cjs

      - name: Validate scrollbar and cache bust CSS
        shell: pwsh
        run: |
          $css = Get-Content frontend/dist/playzone-responsive.css -Raw
          $index = Get-Content frontend/dist/index.html -Raw
          if ($css -notmatch '#pz-left-scroll-track') { throw 'Custom left scrollbar CSS missing.' }
          if ($css -notmatch 'left:2px') { throw 'Custom scrollbar is not pinned left.' }
          if ($css -notmatch 'html::-webkit-scrollbar,body::-webkit-scrollbar') { throw 'Native scrollbar hide rule missing.' }
          if ($index -notmatch '033-ui3') { throw 'Responsive cache bust version missing.' }

      - name: Verify product exclusions
        shell: pwsh
        run: |
          $all = (Get-Content backend/app/main.py -Raw) + (Get-Content frontend/dist/playzone-responsive.js -Raw) + (Get-Content frontend/dist/assets/index-v031.js -Raw)
          if ($all -match 'abo_aYmAn|abo-ayman-logo') { throw 'Unexpected abo_aYmAn branding.' }
          if (Test-Path backend/app/drinks.py) { throw 'Unexpected drinks module.' }
