name: Validate PlayZone v0.33 Port

on:
  push:
    branches:
      - port/abo-updates-no-brand-no-drinks
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python syntax
        shell: pwsh
        run: |
          python -m py_compile backend/app/main.py backend/app/services.py backend/app/windows_service.py

      - name: JavaScript syntax
        shell: pwsh
        run: |
          node --check frontend/dist/assets/index-v031.js
          node --check frontend/dist/playzone-responsive.js
          node --check desktop-shell/main.js

      - name: PowerShell syntax
        shell: pwsh
        run: |
          $files = @(
            'Install-PlayZone-Service.ps1',
            'Launch-PlayZone.ps1',
            'Uninstall-PlayZone-Service.ps1'
          )
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($file, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error "$file : $($_.Message)" }
              exit 1
            }
          }

      - name: Verify original branding
        shell: pwsh
        run: |
          $files = @(
            'backend/app/main.py',
            'frontend/dist/index.html',
            'frontend/dist/assets/index-v031.js',
            'frontend/dist/playzone-responsive.js',
            'frontend/dist/playzone-responsive.css',
            'desktop-shell/main.js',
            'desktop-shell/package.json',
            'Install-PlayZone-Service.ps1',
            'Launch-PlayZone.ps1',
            'Uninstall-PlayZone-Service.ps1'
          )
          foreach ($file in $files) {
            $text = Get-Content -LiteralPath $file -Raw
            if ($text -match 'abo_aYmAn|abo-ayman-logo') {
              Write-Error "abo_aYmAn branding found in $file"
              exit 1
            }
          }
          if (-not (Select-String -Path frontend/dist/index.html -Pattern '<title>PlayZone Manager</title>' -Quiet)) {
            Write-Error 'Original PlayZone Manager title is missing.'
            exit 1
          }

      - name: Verify drinks module excluded
        shell: pwsh
        run: |
          if (Test-Path -LiteralPath 'backend/app/drinks.py') {
            Write-Error 'backend/app/drinks.py must not exist.'
            exit 1
          }
          $backend = Get-Content -LiteralPath 'backend/app/main.py' -Raw
          $frontend = Get-Content -LiteralPath 'frontend/dist/assets/index-v031.js' -Raw
          if ($backend -match '/api/drinks|ensure_drinks_schema|DrinkTab|DrinkItem') {
            Write-Error 'Drinks API markers found in backend.'
            exit 1
          }
          if ($frontend -match 'o===.drinks.|/api/drinks|المشاريب') {
            Write-Error 'Drinks page markers found in frontend.'
            exit 1
          }

      - name: Verify v0.33 feature markers
        shell: pwsh
        run: |
          $backend = Get-Content -LiteralPath 'backend/app/main.py' -Raw
          $frontend = Get-Content -LiteralPath 'frontend/dist/assets/index-v031.js' -Raw
          $installer = Get-Content -LiteralPath 'Install-PlayZone-Service.ps1' -Raw
          if ($backend -notmatch '/api/root/system-logs') { throw 'ROOT System Logs API missing.' }
          if ($frontend -notmatch '/root/system-logs') { throw 'ROOT System Logs UI missing.' }
          if ($frontend -notmatch 'logs:`System Logs`') { throw 'System Logs navigation missing.' }
          if ($installer -notmatch 'ElectronVersion') { throw 'Electron installer block missing.' }
          if (-not (Test-Path 'frontend/dist/playzone-responsive.css')) { throw 'Responsive CSS missing.' }
          if (-not (Test-Path 'frontend/dist/playzone-responsive.js')) { throw 'Responsive JS missing.' }
          if (-not (Test-Path 'offline-runtime/python-3.12.6-embed-amd64.zip')) { throw 'Offline Python runtime missing.' }

      - name: Build validation artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path out | Out-Null
          git archive --format=zip --output=out/PlayZone-Manager-v0.33-source.zip HEAD

      - name: Upload validation artifact
        uses: actions/upload-artifact@v4
        with:
          name: PlayZone-Manager-v0.33-validated-source
          path: out/PlayZone-Manager-v0.33-source.zip
          if-no-files-found: error
          retention-days: 30
