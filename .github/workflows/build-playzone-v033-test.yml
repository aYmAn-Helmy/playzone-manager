name: Build PlayZone Manager v0.33 Test Package

on:
  push:
    branches:
      - build/playzone-v033-test
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate source
        shell: pwsh
        run: |
          python -m py_compile backend/app/main.py backend/app/services.py backend/app/windows_service.py
          node --check frontend/dist/assets/index-v031.js
          node --check frontend/dist/playzone-responsive.js
          node --check desktop-shell/main.js

          $backend = Get-Content backend/app/main.py -Raw
          $frontend = Get-Content frontend/dist/assets/index-v031.js -Raw
          $all = $backend + "`n" + $frontend + "`n" + (Get-Content desktop-shell/main.js -Raw)

          if ($all -match 'abo_aYmAn|abo-ayman-logo') { throw 'Unexpected abo_aYmAn branding detected.' }
          if ($backend -match '/api/drinks|ensure_drinks_schema|DrinkTab|DrinkItem') { throw 'Unexpected drinks backend detected.' }
          if ($frontend -match '/api/drinks|المشاريب|o===.drinks.') { throw 'Unexpected drinks UI detected.' }
          if ($backend -notmatch '/api/root/system-logs') { throw 'ROOT system logs API is missing.' }
          if ($frontend -notmatch '/root/system-logs') { throw 'ROOT system logs UI is missing.' }

          $files = @('Install-PlayZone-Service.ps1','Launch-PlayZone.ps1','Uninstall-PlayZone-Service.ps1')
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($file,[ref]$tokens,[ref]$errors) | Out-Null
            if ($errors.Count -gt 0) { throw "$file has PowerShell syntax errors: $($errors[0].Message)" }
          }

      - name: Prepare clean package
        shell: pwsh
        run: |
          $pkg = Join-Path $PWD 'package'
          New-Item -ItemType Directory -Force -Path $pkg | Out-Null

          foreach ($dir in @('backend','frontend','offline-runtime','desktop-shell','desktop-runtime')) {
            Copy-Item -LiteralPath $dir -Destination (Join-Path $pkg $dir) -Recurse -Force
          }

          $files = @(
            'Bootstrap-Portable.ps1',
            'Install-PlayZone-Service.bat',
            'Install-PlayZone-Service.ps1',
            'Launch-PlayZone.ps1',
            'Uninstall-PlayZone-Service.ps1',
            'Setup-Root-Password.bat',
            'Setup-Root-Password.ps1',
            'Setup-Tailscale-Support.bat',
            'Setup-Tailscale-Support.ps1',
            'REMOTE-SUPPORT-SETUP-AR.txt',
            'TAILSCALE-GRANTS-EXAMPLE.json',
            'PlayStation.ico',
            'README-SERVICE-AR.txt',
            'CHANGES-v0.33-AR.txt',
            'DESKTOP-RUNTIME-AR.txt',
            'VERSION.txt'
          )
          foreach ($file in $files) {
            if (Test-Path -LiteralPath $file) {
              Copy-Item -LiteralPath $file -Destination $pkg -Force
            }
          }

          @'
          PlayZone Manager v0.33 - Test Package
          =====================================

          1) فك الضغط بالكامل في فولدر جديد.
          2) كليك يمين على Install-PlayZone-Service.bat واختر Run as administrator.
          3) النسخة تحافظ على قاعدة البيانات الموجودة عند Upgrade/Reinstall.
          4) البرنامج سيظهر باسم PlayZone Manager.
          5) لا توجد صفحة مشاريب في هذه النسخة.
          6) Desktop App يستخدم Chromium/Electron مدمج.
          7) بعد التثبيت افتح PlayZone Manager من سطح المكتب.
          8) لو عندك نسخة حالية، يفضل أخذ Backup من داخل البرنامج قبل التحديث.

          ملاحظة:
          Electron runtime الرسمي مرفق داخل هذه الباكدج، لذلك لا يحتاج تنزيله وقت التثبيت.
          '@ | Set-Content -LiteralPath (Join-Path $pkg 'TEST-INSTRUCTIONS-AR.txt') -Encoding UTF8

      - name: Bundle verified Electron runtime
        shell: pwsh
        run: |
          $version = '44.4.5'
          $name = "electron-v$version-win32-x64.zip"
          $url = "https://github.com/electron/electron/releases/download/v$version/$name"
          $expected = '11c395820a5aaa8ebcc0686b476d0ac98a730274ebfbdc8cf5538a7c2815cb5d'
          $dest = Join-Path $PWD "package\desktop-runtime\$name"
          Invoke-WebRequest -UseBasicParsing -Uri $url -OutFile $dest
          $actual = (Get-FileHash -LiteralPath $dest -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw "Electron SHA256 mismatch: $actual" }

      - name: Final package checks
        shell: pwsh
        run: |
          if (Test-Path 'package\backend\app\drinks.py') { throw 'drinks.py unexpectedly packaged.' }
          $bad = Get-ChildItem -LiteralPath package -Recurse -File | Where-Object {
            $_.Name -match 'abo_aYmAn|abo-ayman|abo-addon'
          }
          if ($bad) { throw "Unexpected branded file(s): $($bad.FullName -join ', ')" }

          $textFiles = Get-ChildItem package -Recurse -File | Where-Object {
            $_.Extension -in @('.py','.js','.css','.html','.ps1','.bat','.txt','.json','.md')
          }
          foreach ($file in $textFiles) {
            $text = Get-Content -LiteralPath $file.FullName -Raw -ErrorAction SilentlyContinue
            if ($text -match 'abo_aYmAn|abo-ayman-logo') {
              throw "Unexpected abo_aYmAn branding in package: $($file.FullName)"
            }
          }

      - name: Create ZIP
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path out | Out-Null
          Compress-Archive -Path package\* -DestinationPath out\PlayZone-Manager-v0.33-Test-Full.zip -CompressionLevel Optimal -Force
          (Get-FileHash out\PlayZone-Manager-v0.33-Test-Full.zip -Algorithm SHA256).Hash.ToLowerInvariant() |
            Set-Content out\PlayZone-Manager-v0.33-Test-Full.zip.sha256 -Encoding ASCII

      - name: Upload test package
        uses: actions/upload-artifact@v4
        with:
          name: PlayZone-Manager-v0.33-Test-Full
          path: out/*
          if-no-files-found: error
          retention-days: 30
