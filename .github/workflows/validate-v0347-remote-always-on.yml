name: Validate v0.34.7 Always-On Remote Support

on:
  push:
    branches:
      - feature/v0347-remote-always-on
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Source syntax and version checks
        shell: pwsh
        run: |
          python -m py_compile backend/app/tailscale_support.py backend/app/windows_service.py backend/app/main.py
          node --check desktop-shell/main.js

          $version = (Get-Content VERSION.txt -Raw).Trim()
          if ($version -ne '0.34.7') { throw "VERSION mismatch: $version" }

          $main = Get-Content backend/app/main.py -Raw
          if (-not $main.Contains('version="0.34.7"')) { throw 'Backend version mismatch.' }

          $desktop = Get-Content desktop-shell/package.json -Raw
          if (-not $desktop.Contains('"version": "0.34.7"')) { throw 'Desktop version mismatch.' }

          $service = Get-Content backend/app/windows_service.py -Raw
          if (-not $service.Contains('PLAYZONE_REMOTE_SUPPORT_ALWAYS_ON')) { throw 'Always-on service policy missing.' }

          $tailscale = Get-Content backend/app/tailscale_support.py -Raw
          if (-not $tailscale.Contains('and not status.get("serve_active")')) { throw 'Serve recovery condition missing.' }
          if (-not $tailscale.Contains('status = enable_remote_access()')) { throw 'Serve auto-enable recovery missing.' }

          foreach ($file in @('Install-PlayZone-Service.ps1','Setup-Tailscale-Support.ps1')) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($file,[ref]$tokens,[ref]$errors) | Out-Null
            if ($errors.Count -gt 0) { throw "$file syntax error: $($errors[0].Message)" }
          }

      - name: Mocked watchdog behavior test
        shell: pwsh
        run: |
          @'
          import os
          import sys
          from pathlib import Path

          sys.path.insert(0, str(Path("backend").resolve()))
          import app.tailscale_support as ts

          class DummyProc:
              returncode = 0
              stdout = ""
              stderr = ""

          calls = {"enable": 0, "reconnect": 0, "sc": []}

          ts._find_tailscale = lambda: r"C:\Program Files\Tailscale\tailscale.exe"
          ts.subprocess.run = lambda args, **kwargs: calls["sc"].append(args) or DummyProc()

          os.environ["PLAYZONE_REMOTE_SUPPORT_ALWAYS_ON"] = "1"
          ts.get_status = lambda: {
              "supported": True,
              "installed": True,
              "connected": True,
              "needs_login": False,
              "serve_active": False,
          }
          def enable():
              calls["enable"] += 1
              return {
                  "supported": True,
                  "installed": True,
                  "connected": True,
                  "needs_login": False,
                  "serve_active": True,
                  "remote_url": "https://playzone-test.tail.test",
              }
          ts.enable_remote_access = enable
          result = ts.ensure_always_on()
          assert calls["enable"] == 1, calls
          assert result["serve_active"] is True

          try:
              ts.disable_remote_access()
          except ts.TailscaleSupportError:
              pass
          else:
              raise AssertionError("Always-On policy allowed Remote Access to be disabled")

          calls["enable"] = 0
          os.environ["PLAYZONE_REMOTE_SUPPORT_ALWAYS_ON"] = "0"
          result = ts.ensure_always_on()
          assert calls["enable"] == 0, calls

          print("ALWAYS_ON_REMOTE_SUPPORT_OK")
          '@ | Set-Content validate_remote_watchdog.py -Encoding UTF8
          python validate_remote_watchdog.py
