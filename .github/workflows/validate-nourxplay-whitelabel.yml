name: Validate nourxplay White Label v0.35.0

on:
  push:
    branches:
      - brand/nourxplay-whitelabel
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Syntax checks
        shell: pwsh
        run: |
          python -m py_compile backend/app/main.py backend/app/windows_service.py backend/app/tailscale_support.py backend/app/root_setup.py
          node --check frontend/dist/assets/index-v031.js
          node --check frontend/dist/playzone-responsive.js
          node --check desktop-shell/main.js

          foreach ($file in @(
            'Install-PlayZone-Service.ps1',
            'Launch-PlayZone.ps1',
            'Setup-Tailscale-Support.ps1',
            'Setup-Root-Password.ps1',
            'Uninstall-PlayZone-Service.ps1',
            'Verify-PlayZone-Service.ps1'
          )) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($file,[ref]$tokens,[ref]$errors) | Out-Null
            if ($errors.Count -gt 0) { throw "$file syntax error: $($errors[0].Message)" }
          }

      - name: White-label audit
        shell: pwsh
        run: |
          if ((Get-Content VERSION.txt -Raw).Trim() -ne '0.35.0') { throw 'VERSION must be 0.35.0.' }

          $ui = Get-Content frontend/dist/assets/index-v031.js -Raw
          $html = Get-Content frontend/dist/index.html -Raw
          $desktop = Get-Content desktop-shell/main.js -Raw
          $desktopPkg = Get-Content desktop-shell/package.json -Raw
          $installer = Get-Content Install-PlayZone-Service.ps1 -Raw
          $service = Get-Content backend/app/windows_service.py -Raw
          $tailscale = Get-Content backend/app/tailscale_support.py -Raw
          $backend = Get-Content backend/app/main.py -Raw

          if ($ui.Contains('PlayZone')) { throw 'Legacy PlayZone brand still appears in customer UI bundle.' }
          if (-not $ui.Contains('nourxplay')) { throw 'nourxplay brand missing from UI bundle.' }
          if (-not $html.Contains('<title>nourxplay</title>')) { throw 'HTML title is not nourxplay.' }
          if (-not $html.Contains('0350-nourxplay')) { throw 'White-label frontend cache key missing.' }

          if (-not $desktop.Contains("app.setName('nourxplay')")) { throw 'Electron app name mismatch.' }
          if (-not $desktop.Contains("title: 'nourxplay'")) { throw 'Electron window title mismatch.' }
          if ($desktop.Contains('<h1>PlayZone Manager</h1>')) { throw 'Legacy brand remains in waiting screen.' }
          if ($desktop.Contains('<b>PlayZoneManager</b>')) { throw 'Internal service identifier leaks into waiting screen.' }
          if (-not $desktopPkg.Contains('"productName": "nourxplay"')) { throw 'Desktop productName mismatch.' }
          if (-not $desktopPkg.Contains('"version": "0.35.0"')) { throw 'Desktop version mismatch.' }

          if (-not $backend.Contains('FastAPI(title="nourxplay API", version="0.35.0")')) { throw 'Backend brand/version mismatch.' }
          if (-not $service.Contains('SERVICE_DISPLAY_NAME = "nourxplay Service"')) { throw 'Windows service display name mismatch.' }
          if (-not $tailscale.Contains('return f"nourxplay-{safe}"[:63]')) { throw 'Tailscale hostname is not branded.' }

          if (-not $installer.Contains("'nourxplay.exe'")) { throw 'Installer does not create nourxplay.exe.' }
          if (-not $installer.Contains("'nourxplay.lnk'")) { throw 'Installer does not create nourxplay shortcut.' }
          if (-not $installer.Contains("'PlayZone Manager.lnk'")) { throw 'Upgrade cleanup for legacy shortcut missing.' }
          if (-not $installer.Contains("'PlayZone Manager'")) { throw 'Legacy compatible internal roots were removed unexpectedly.' }

          foreach ($file in @(
            'Install-nourxplay.bat',
            'Uninstall-nourxplay.bat',
            'Setup-nourxplay-Remote-Support.bat',
            'Setup-nourxplay-Root-Password.bat',
            'README-NOURXPLAY-AR.txt'
          )) {
            if (-not (Test-Path -LiteralPath $file)) { throw "Missing branded customer entrypoint: $file" }
          }

          Write-Host 'NOURXPLAY_WHITE_LABEL_AUDIT_OK'

      - name: Installer branding smoke test
        shell: pwsh
        run: |
          $installer = Get-Content Install-PlayZone-Service.ps1 -Raw
          $uninstaller = Get-Content Uninstall-PlayZone-Service.ps1 -Raw
          if (-not $installer.Contains("nourxplay v0.35.0 - White Label Edition")) { throw 'Installer heading mismatch.' }
          if (-not $uninstaller.Contains("nourxplay - Complete Uninstaller")) { throw 'Uninstaller heading mismatch.' }
          if (-not $uninstaller.Contains("'nourxplay.lnk','PlayZone Manager.lnk'")) { throw 'Uninstaller compatibility shortcut cleanup missing.' }
          Write-Host 'NOURXPLAY_INSTALLER_BRANDING_OK'
