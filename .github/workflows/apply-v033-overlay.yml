name: Apply verified abo_aYmAn v0.33 ZIP overlay

on:
  push:
    branches: [abo_aYmAn]
    paths:
      - ".github/workflows/apply-v033-overlay.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild verified archive
        shell: bash
        run: |
          set -euo pipefail
          cat releases/v0.33/source-overlay.part*.b64 > /tmp/v033-overlay.b64
          base64 -d /tmp/v033-overlay.b64 > /tmp/v033-overlay.tar.xz
          tar -tJf /tmp/v033-overlay.tar.xz >/tmp/v033-files.txt
          tar -xJf /tmp/v033-overlay.tar.xz
          rm -f frontend/dist/assets/index-v031.js frontend/dist/assets/index-v031.css

      - name: Validate latest files
        shell: bash
        run: |
          set -euo pipefail
          test -f backend/app/drinks.py
          test -f desktop-shell/main.js
          test -f desktop-shell/package.json
          test -f frontend/dist/abo-addon.js
          test -f frontend/dist/abo-addon.css
          test -f frontend/dist/assets/index-abo-v031a2.js
          test -f frontend/dist/assets/index-abo-v031a2.css
          test -f Uninstall-abo_aYmAn.bat
          test -f Uninstall-abo_aYmAn.ps1
          test -f CHANGES-abo-v0.33-AR.txt
          test "$(tr -d '\r\n ' < VERSION.txt)" = "0.33"
          grep -q "abo-addon" frontend/dist/index.html
          python -m py_compile backend/app/*.py
          node --check frontend/dist/abo-addon.js
          node --check desktop-shell/main.js

      - name: Commit applied files
        shell: bash
        run: |
          set -euo pipefail
          rm -rf releases/v0.33
          rm -f .github/workflows/apply-v033-overlay.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Sync abo_aYmAn v0.33 from latest ZIP"
          git push origin HEAD:abo_aYmAn
