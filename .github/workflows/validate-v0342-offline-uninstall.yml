name: Validate PlayZone v0.34.2 Offline Installer

on:
  push:
    branches:
      - fix/v0342-offline-uninstall
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate source syntax and version
        shell: pwsh
        run: |
          python -m py_compile backend/app/main.py backend/app/services.py backend/app/models.py backend/app/schemas.py backend/app/db.py backend/app/windows_service.py
          node --check frontend/dist/assets/index-v031.js
          node --check frontend/dist/playzone-responsive.js
          node --check desktop-shell/main.js

          if ((Get-Content VERSION.txt -Raw).Trim() -ne '0.34.2') { throw 'VERSION.txt must be 0.34.2.' }
          if (-not (Test-Path 'Uninstall-PlayZone-Service.bat')) { throw 'Uninstall BAT missing.' }
          if (-not (Test-Path 'Uninstall-PlayZone-Service.ps1')) { throw 'Uninstall PS1 missing.' }
          if (-not (Test-Path 'offline-runtime\wheels\typing_inspection-0.4.4-py3-none-any.whl')) { throw 'typing_inspection wheel missing from source.' }

          foreach ($file in @('Bootstrap-Portable.ps1','Install-PlayZone-Service.ps1','Uninstall-PlayZone-Service.ps1')) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($file,[ref]$tokens,[ref]$errors) | Out-Null
            if ($errors.Count -gt 0) { throw "$file has syntax errors: $($errors[0].Message)" }
          }

          $installer = Get-Content Install-PlayZone-Service.ps1 -Raw
          if (-not $installer.Contains("'Uninstall-PlayZone-Service.ps1','Uninstall-PlayZone-Service.bat'")) {
            throw 'Installer does not copy both uninstall launchers.'
          }

      - name: Prepare package exactly like client build
        shell: pwsh
        run: |
          $pkg = Join-Path $PWD 'package'
          New-Item -ItemType Directory -Force -Path $pkg | Out-Null

          foreach ($dir in @('backend','frontend','offline-runtime','desktop-shell','desktop-runtime')) {
            Copy-Item -LiteralPath $dir -Destination (Join-Path $pkg $dir) -Recurse -Force
          }

          foreach ($file in @(
            'Bootstrap-Portable.ps1',
            'Install-PlayZone-Service.bat',
            'Install-PlayZone-Service.ps1',
            'Launch-PlayZone.ps1',
            'Uninstall-PlayZone-Service.bat',
            'Uninstall-PlayZone-Service.ps1',
            'Setup-Root-Password.bat',
            'Setup-Root-Password.ps1',
            'Setup-Tailscale-Support.bat',
            'Setup-Tailscale-Support.ps1',
            'REMOTE-SUPPORT-SETUP-AR.txt',
            'TAILSCALE-GRANTS-EXAMPLE.json',
            'PlayStation.ico',
            'README-SERVICE-AR.txt',
            'CHANGES-v0.34-AR.txt',
            'DESKTOP-RUNTIME-AR.txt',
            'VERSION.txt'
          )) {
            if (Test-Path -LiteralPath $file) { Copy-Item -LiteralPath $file -Destination $pkg -Force }
          }

          # Remove only known generated/cache content. Never use substring filters
          # such as "spec" because typing_inspection is a required dependency wheel.
          Get-ChildItem -LiteralPath $pkg -Recurse -Directory -Force |
            Where-Object { $_.Name -in @('__pycache__','.pytest_cache','.git','.github','node_modules') } |
            Sort-Object FullName -Descending |
            Remove-Item -Recurse -Force -ErrorAction SilentlyContinue

          Get-ChildItem -LiteralPath $pkg -Recurse -File -Force |
            Where-Object { $_.Extension -in @('.pyc','.pyo','.log','.db','.sqlite','.sqlite3') } |
            Remove-Item -Force -ErrorAction SilentlyContinue

          if (-not (Test-Path 'package\offline-runtime\wheels\typing_inspection-0.4.4-py3-none-any.whl')) {
            throw 'Package cleanup deleted typing_inspection.'
          }
          if (-not (Test-Path 'package\Uninstall-PlayZone-Service.bat')) { throw 'Packaged Uninstall BAT missing.' }
          if (-not (Test-Path 'package\Uninstall-PlayZone-Service.ps1')) { throw 'Packaged Uninstall PS1 missing.' }

      - name: Rehearse packaged offline Python bootstrap
        shell: pwsh
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File package\Bootstrap-Portable.ps1 -PayloadRoot package\offline-runtime
          if ($LASTEXITCODE -ne 0) { throw "Packaged offline bootstrap failed: $LASTEXITCODE" }

          $python = Join-Path $PWD 'package\.runtime\python\python.exe'
          if (-not (Test-Path -LiteralPath $python)) { throw 'Packaged Python runtime was not created.' }
          & $python -c "import fastapi,uvicorn,sqlalchemy,pydantic,httpx,argon2,tzdata,win32serviceutil,typing_inspection; print('PACKAGED_OFFLINE_RUNTIME_OK')"
          if ($LASTEXITCODE -ne 0) { throw 'Packaged runtime import verification failed.' }

          Remove-Item -LiteralPath 'package\.runtime' -Recurse -Force
          Remove-Item -LiteralPath 'package\Bootstrap-Portable.log' -Force -ErrorAction SilentlyContinue

      - name: Final clean-package audit
        shell: pwsh
        run: |
          $required = @(
            'package\Uninstall-PlayZone-Service.bat',
            'package\Uninstall-PlayZone-Service.ps1',
            'package\offline-runtime\wheels\typing_inspection-0.4.4-py3-none-any.whl',
            'package\Install-PlayZone-Service.bat',
            'package\VERSION.txt'
          )
          foreach ($path in $required) {
            if (-not (Test-Path -LiteralPath $path)) { throw "Required client file missing: $path" }
          }

          $wheelCount = @(Get-ChildItem 'package\offline-runtime\wheels' -Filter '*.whl' -File).Count
          if ($wheelCount -lt 25) { throw "Unexpectedly low wheel count after package cleanup: $wheelCount" }

          if (Test-Path 'package\.runtime') { throw 'Validation runtime leaked into package.' }
          if ((Get-Content 'package\VERSION.txt' -Raw).Trim() -ne '0.34.2') { throw 'Packaged version mismatch.' }
