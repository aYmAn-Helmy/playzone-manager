name: Build and Validate PlayZone v0.34.4 Client Acceptance

on:
  push:
    branches:
      - release/v0344-client-acceptance
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-client-acceptance:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Source syntax and release audit
        shell: pwsh
        run: |
          python -m py_compile backend/app/main.py backend/app/services.py backend/app/models.py backend/app/schemas.py backend/app/db.py backend/app/windows_service.py backend/app/embedded_voltra.py backend/voltra_local/dashboard.py
          node --check frontend/dist/assets/index-v031.js
          node --check frontend/dist/playzone-responsive.js
          node --check desktop-shell/main.js

          $version = (Get-Content VERSION.txt -Raw).Trim()
          if ($version -ne '0.34.4') { throw "VERSION mismatch: $version" }

          $backend = Get-Content backend/app/main.py -Raw
          $services = Get-Content backend/app/services.py -Raw
          $frontend = Get-Content frontend/dist/assets/index-v031.js -Raw
          $css = Get-Content frontend/dist/playzone-responsive.css -Raw
          $index = Get-Content frontend/dist/index.html -Raw
          $desktop = Get-Content desktop-shell/package.json -Raw
          $installer = Get-Content Install-PlayZone-Service.ps1 -Raw
          $uninstaller = Get-Content Uninstall-PlayZone-Service.ps1 -Raw

          if (-not $backend.Contains('version="0.34.4"')) { throw 'Backend version mismatch.' }
          if (-not $desktop.Contains('"version": "0.34.4"')) { throw 'Desktop version mismatch.' }
          if (-not $index.Contains('0344-final')) { throw 'Frontend cache key is not v0.34.4.' }
          if (-not $installer.Contains('param([switch]$NonInteractive)')) { throw 'Installer QA mode missing.' }

          if (-not $backend.Contains('/api/shifts/{shift_id}/handoff')) { throw 'Shift handoff API missing.' }
          if (-not $backend.Contains('drawer_settlements')) { throw 'Settlement report API missing.' }
          if ($services.Contains('Cannot close the drawer while any session is active')) { throw 'Drawer close still blocks active sessions.' }
          if (-not $frontend.Contains('تسليم الوردية لموظف آخر')) { throw 'Shift handoff UI missing.' }
          if (-not $frontend.Contains('تسلسل تصفية الدرج وإقفال الورديات')) { throw 'Settlement report UI missing.' }
          if (-not $frontend.Contains('Ge=!!x;')) { throw 'Session controls are not gated by an open shift.' }
          if (-not $frontend.Contains('إعادة تعيين كلمة المرور -')) { throw 'Employee reset modal missing.' }
          if (-not $frontend.Contains('تأكيد التعطيل')) { throw 'Employee disable modal missing.' }
          if (-not $frontend.Contains('وردية مفتوحة')) { throw 'Open shift chip missing.' }

          $chipStart = $frontend.IndexOf('function lt({shift:e,onOpen:t,onManage:n})')
          if ($chipStart -lt 0) { throw 'Open shift chip function missing.' }
          $chip = $frontend.Substring($chipStart, [Math]::Min(1000, $frontend.Length - $chipStart))
          if ($chip.Contains('رصيد الدرج') -or $chip.Contains('expected_cash_piasters')) {
            throw 'Open shift chip still leaks drawer balance.'
          }

          if (-not $css.Contains('#pz-left-scroll-track')) { throw 'Main left scrollbar missing.' }
          if (-not $css.Contains('*:not(html):not(body)::-webkit-scrollbar')) { throw 'Global scrollbar skin missing.' }
          if (-not $css.Contains('.sidebar.pz-auto-sidebar>nav{flex:1 1 auto!important;min-height:0!important;overflow-y:auto!important')) { throw 'Sidebar short-screen scrolling missing.' }

          if (-not (Test-Path 'Uninstall-PlayZone-Service.bat')) { throw 'Uninstall BAT missing.' }
          if (-not (Test-Path 'Uninstall-PlayZone-Service.ps1')) { throw 'Uninstall PS1 missing.' }
          if (-not $installer.Contains("'Uninstall-PlayZone-Service.ps1','Uninstall-PlayZone-Service.bat'")) { throw 'Installer does not copy uninstall files.' }

          $all = $backend + $services + $frontend + $css + (Get-Content backend/voltra_local/dashboard.py -Raw)
          if ($all -match 'abo_aYmAn|abo-ayman-logo|abo-addon') { throw 'Unexpected old branding.' }
          if (Test-Path backend/app/drinks.py) { throw 'Unexpected drinks module.' }
          if ($frontend -match '/api/drinks|المشاريب') { throw 'Unexpected drinks UI.' }

          foreach ($file in @('Bootstrap-Portable.ps1','Install-PlayZone-Service.ps1','Uninstall-PlayZone-Service.ps1','Setup-Root-Password.ps1','Setup-Tailscale-Support.ps1')) {
            if (-not (Test-Path -LiteralPath $file)) { continue }
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($file,[ref]$tokens,[ref]$errors) | Out-Null
            if ($errors.Count -gt 0) { throw "$file syntax error: $($errors[0].Message)" }
          }

      - name: Install QA dependencies
        shell: pwsh
        run: |
          python -m pip install -r backend/requirements.txt
          npm install --no-save electron@44.4.5 playwright-core@1.55.0

      - name: Prepare clean complete client package
        shell: pwsh
        run: |
          $pkg = Join-Path $PWD 'package'
          New-Item -ItemType Directory -Force -Path $pkg | Out-Null

          foreach ($dir in @('backend','frontend','offline-runtime','desktop-shell','desktop-runtime')) {
            Copy-Item -LiteralPath $dir -Destination (Join-Path $pkg $dir) -Recurse -Force
          }

          foreach ($file in @(
            'Bootstrap-Portable.ps1',
            'Install-PlayZone-Service.bat',
            'Install-PlayZone-Service.ps1',
            'Launch-PlayZone.ps1',
            'Uninstall-PlayZone-Service.bat',
            'Uninstall-PlayZone-Service.ps1',
            'Setup-Root-Password.bat',
            'Setup-Root-Password.ps1',
            'Setup-Tailscale-Support.bat',
            'Setup-Tailscale-Support.ps1',
            'REMOTE-SUPPORT-SETUP-AR.txt',
            'TAILSCALE-GRANTS-EXAMPLE.json',
            'PlayStation.ico',
            'README-SERVICE-AR.txt',
            'CHANGES-v0.34-AR.txt',
            'DESKTOP-RUNTIME-AR.txt',
            'VERSION.txt'
          )) {
            if (Test-Path -LiteralPath $file) { Copy-Item -LiteralPath $file -Destination $pkg -Force }
          }

          Get-ChildItem -LiteralPath $pkg -Recurse -Directory -Force |
            Where-Object { $_.Name -in @('__pycache__','.pytest_cache','.git','.github','node_modules') } |
            Sort-Object FullName -Descending |
            Remove-Item -Recurse -Force -ErrorAction SilentlyContinue

          Get-ChildItem -LiteralPath $pkg -Recurse -File -Force |
            Where-Object { $_.Extension -in @('.pyc','.pyo','.log','.db','.sqlite','.sqlite3') } |
            Remove-Item -Force -ErrorAction SilentlyContinue

          if (-not (Test-Path 'package\offline-runtime\wheels\typing_inspection-0.4.4-py3-none-any.whl')) {
            throw 'typing_inspection was removed from the final package.'
          }

          @'
          PlayZone Manager v0.34.4 — Client Acceptance
          =============================================

          هذه نسخة كاملة للتثبيت على جهاز العميل واختبار القبول النهائي.

          التثبيت:
          1) فك الضغط بالكامل.
          2) شغّل Install-PlayZone-Service.bat باستخدام Run as administrator.
          3) Python Runtime وElectron/Chromium مرفقان داخل الحزمة للعمل Offline.
          4) بيانات PlayZone تحفظ في ProgramData وتظل محفوظة في التحديثات.

          اختبار مقترح:
          - تسجيل الدخول وفتح وردية.
          - التأكد أن بطاقة الوردية تعرض اسم الموظف فقط بدون رصيد الدرج.
          - بدء جلسة مفتوحة ومحددة، Pause/Resume، تغيير عدد الأذرع، وإنهاء وإصدار فاتورة.
          - تسجيل مصروف والتأكد أنه Pending حتى اعتماد المدير.
          - تصفية الدرج بباسورد المدير مع بقاء أي جلسة مفتوحة شغالة.
          - تسليم الوردية لموظف آخر بباسورد الموظف المستلم.
          - مراجعة تسلسل إقفالات الدرج وسجل تسليم الورديات في Reports.
          - تجربة إعادة تعيين كلمة مرور موظف وتعطيله ثم تفعيله.
          - تجربة زر العين لإخفاء إجمالي الإيرادات وساعات اللعب.
          - تجربة Voltra داخل PlayZone والضغط على تبويباتها.
          - تصغير ارتفاع النافذة والتأكد من Scroll داخل الـSidebar.
          - مراجعة الـScrollbars في الجداول والقوائم.

          الإزالة بعد الاختبار:
          - شغّل Uninstall-PlayZone-Service.bat كمسؤول.
          - الإزالة العادية تحذف البرنامج والخدمة وتُبقي قاعدة البيانات والـBackups.
          - لو تريد تنظيف جهاز الاختبار بالكامل بما في ذلك البيانات:
              Uninstall-PlayZone-Service.bat /RemoveData
          '@ | Set-Content -LiteralPath (Join-Path $pkg 'CLIENT-ACCEPTANCE-TEST-AR.txt') -Encoding UTF8

      - name: Bundle verified Electron runtime
        shell: pwsh
        run: |
          $version = '44.4.5'
          $name = "electron-v$version-win32-x64.zip"
          $url = "https://github.com/electron/electron/releases/download/v$version/$name"
          $expected = '11c395820a5aaa8ebcc0686b476d0ac98a730274ebfbdc8cf5538a7c2815cb5d'
          $dest = Join-Path $PWD "package\desktop-runtime\$name"
          if (Test-Path -LiteralPath $dest) { Remove-Item -LiteralPath $dest -Force }
          Invoke-WebRequest -UseBasicParsing -Uri $url -OutFile $dest
          $actual = (Get-FileHash -LiteralPath $dest -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw "Electron SHA256 mismatch: $actual" }

      - name: Rehearse final-package offline Python runtime
        shell: pwsh
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File package\Bootstrap-Portable.ps1 -PayloadRoot package\offline-runtime
          if ($LASTEXITCODE -ne 0) { throw "Offline bootstrap failed: $LASTEXITCODE" }
          $python = Join-Path $PWD 'package\.runtime\python\python.exe'
          & $python -c "import fastapi,uvicorn,sqlalchemy,pydantic,httpx,argon2,tzdata,win32serviceutil,typing_inspection; print('OFFLINE_RUNTIME_OK')"
          if ($LASTEXITCODE -ne 0) { throw 'Offline runtime imports failed.' }
          & $python -m pip check
          if ($LASTEXITCODE -ne 0) { throw 'Offline runtime pip check failed.' }
          Remove-Item -LiteralPath 'package\.runtime' -Recurse -Force
          Remove-Item -LiteralPath 'package\Bootstrap-Portable.log' -Force -ErrorAction SilentlyContinue

      - name: Preseed clean client database for real installer test
        shell: pwsh
        run: |
          $installRoot = Join-Path $env:ProgramFiles 'PlayZone Manager'
          $dataRoot = Join-Path $env:ProgramData 'PlayZone Manager'
          Get-Process -Name 'PlayZone Manager' -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          if (Get-Service -Name PlayZoneManager -ErrorAction SilentlyContinue) {
            Stop-Service PlayZoneManager -Force -ErrorAction SilentlyContinue
            sc.exe delete PlayZoneManager | Out-Null
            Start-Sleep -Seconds 2
          }
          Remove-Item -LiteralPath $installRoot -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item -LiteralPath $dataRoot -Recurse -Force -ErrorAction SilentlyContinue

          $secure = Join-Path $dataRoot 'secure-data'
          New-Item -ItemType Directory -Force -Path $secure | Out-Null
          $env:PLAYZONE_DB_PATH = Join-Path $secure 'playzone.db'
          "PLAYZONE_DB_PATH=$env:PLAYZONE_DB_PATH" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          @'
          from sqlalchemy import select
          from app.main import seed_data
          from app.db import SessionLocal
          from app.models import User
          from app.activation import ACTIVATION_HASH_KEY, machine_hash, set_setting
          from app.security import hash_password

          ROOT_PASSWORD = "Root-Acceptance-123!"
          ADMIN_PASSWORD = "Admin-Acceptance-123!"
          STAFF_PASSWORD = "Staff-Acceptance-123!"

          seed_data()
          with SessionLocal() as db:
              set_setting(db, ACTIVATION_HASH_KEY, machine_hash())

              root = db.scalar(select(User).where(User.username == "root"))
              root.password_hash = hash_password(ROOT_PASSWORD)
              root.must_change_password = False
              root.is_active = True
              set_setting(db, "root_password_initialized", "1")
              set_setting(db, "development_passwordless_privileged", "0")

              admin = db.scalar(select(User).where(User.username == "admin"))
              admin.password_hash = hash_password(ADMIN_PASSWORD)
              admin.must_change_password = False
              admin.is_active = True

              for username, display in (
                  ("qa-cashier-1", "QA Cashier 1"),
                  ("qa-cashier-2", "QA Cashier 2"),
                  ("qa-actions", "QA Actions"),
              ):
                  row = db.scalar(select(User).where(User.username == username))
                  if row is None:
                      row = User(
                          username=username,
                          display_name=display,
                          password_hash=hash_password(STAFF_PASSWORD),
                          role="STAFF",
                          must_change_password=False,
                          is_active=True,
                      )
                      db.add(row)
                  else:
                      row.password_hash = hash_password(STAFF_PASSWORD)
                      row.must_change_password = False
                      row.is_active = True
              db.commit()
          print("PRESEEDED_CLIENT_DB_OK")
          '@ | Set-Content (Join-Path $env:RUNNER_TEMP 'preseed_client.py') -Encoding UTF8

          $env:PYTHONPATH = (Resolve-Path backend).Path
          python (Join-Path $env:RUNNER_TEMP 'preseed_client.py')

      - name: Real full Windows installation
        shell: pwsh
        run: |
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File package\Install-PlayZone-Service.ps1 -NonInteractive
          if ($LASTEXITCODE -ne 0) { throw "Real installer failed: $LASTEXITCODE" }

          $installRoot = Join-Path $env:ProgramFiles 'PlayZone Manager'
          $dataRoot = Join-Path $env:ProgramData 'PlayZone Manager'
          $svc = Get-Service -Name PlayZoneManager -ErrorAction Stop
          if ($svc.Status -ne 'Running') { throw "Service is not running: $($svc.Status)" }
          if ((Get-Content (Join-Path $installRoot 'VERSION.txt') -Raw).Trim() -ne '0.34.4') { throw 'Installed version mismatch.' }
          if (-not (Test-Path (Join-Path $installRoot 'desktop-runtime\PlayZone Manager.exe'))) { throw 'Installed desktop EXE missing.' }
          if (-not (Test-Path (Join-Path $installRoot 'Uninstall-PlayZone-Service.bat'))) { throw 'Installed uninstall BAT missing.' }
          if (-not (Test-Path (Join-Path $installRoot 'Uninstall-PlayZone-Service.ps1'))) { throw 'Installed uninstall PS1 missing.' }
          if (-not (Test-Path (Join-Path $dataRoot 'secure-data\playzone.db'))) { throw 'Protected database missing after install.' }

          $health = Invoke-RestMethod -Uri http://127.0.0.1:8000/api/health -TimeoutSec 5
          if (-not $health.ok) { throw 'Installed service health failed.' }
          $ui = Invoke-WebRequest -UseBasicParsing -Uri http://127.0.0.1:8000/ -TimeoutSec 5
          if ($ui.StatusCode -ne 200 -or $ui.Content.Length -lt 100) { throw 'Installed UI did not load.' }

          $tcp = New-Object Net.Sockets.TcpClient
          $iar = $tcp.BeginConnect('127.0.0.1',10086,$null,$null)
          if (-not ($iar.AsyncWaitHandle.WaitOne(3000) -and $tcp.Connected)) { throw 'Installed Voltra TCP listener is not reachable.' }
          $tcp.Close()

          foreach ($shortcut in @(
            (Join-Path ([Environment]::GetFolderPath('CommonDesktopDirectory')) 'PlayZone Manager.lnk'),
            (Join-Path ([Environment]::GetFolderPath('CommonPrograms')) 'PlayZone Manager.lnk'),
            (Join-Path ([Environment]::GetFolderPath('CommonStartup')) 'PlayZone Manager.lnk')
          )) {
            if (-not (Test-Path -LiteralPath $shortcut)) { throw "Expected shortcut missing: $shortcut" }
          }
          Write-Host 'REAL_WINDOWS_INSTALL_OK'

      - name: Comprehensive installed-backend functional test
        shell: pwsh
        run: |
          @'
          import httpx

          BASE = "http://127.0.0.1:8000"
          ADMIN_PASSWORD = "Admin-Acceptance-123!"
          ROOT_PASSWORD = "Root-Acceptance-123!"
          STAFF_PASSWORD = "Staff-Acceptance-123!"

          def req(method, path, token=None, json=None, expected=200, params=None):
              headers = {"Authorization": f"Bearer {token}"} if token else {}
              r = httpx.request(method, BASE + path, headers=headers, json=json, params=params, timeout=15)
              if r.status_code != expected:
                  raise AssertionError(f"{method} {path}: expected {expected}, got {r.status_code}: {r.text}")
              return r

          def login(username, password):
              return req("POST", "/api/auth/login", json={"username": username, "password": password}).json()["token"]

          admin = login("admin", ADMIN_PASSWORD)
          root = login("root", ROOT_PASSWORD)
          staff1_old = login("qa-cashier-1", STAFF_PASSWORD)
          staff2_old = login("qa-cashier-2", STAFF_PASSWORD)

          stations = req("GET", "/api/stations", admin).json()
          assert len(stations) >= 2
          station1, station2 = stations[0]["id"], stations[1]["id"]

          # Session actions are protected by an open shift.
          req("POST", f"/api/stations/{station1}/sessions/start", admin,
              {"session_type":"OPEN","duration_seconds":None,"controller_count":2}, expected=409)

          shift1 = req("POST", "/api/shifts/open", admin, {"opening_cash_piasters":0}).json()

          product = req("POST", "/api/products", admin, {"name":"QA Snack","price_piasters":250}).json()

          session1 = req("POST", f"/api/stations/{station1}/sessions/start", admin,
              {"session_type":"OPEN","duration_seconds":None,"controller_count":2}).json()
          sid1 = session1["id"]
          changed = req("POST", f"/api/sessions/{sid1}/controllers", admin, {"controller_count":3}).json()
          assert changed["controller_count"] == 3
          assert req("POST", f"/api/sessions/{sid1}/pause", admin).json()["status"] == "PAUSED"
          assert req("POST", f"/api/sessions/{sid1}/resume", admin).json()["status"] == "RUNNING"
          item = req("POST", f"/api/sessions/{sid1}/items", admin, {"product_id":product["id"],"quantity":2}).json()
          assert item["line_total_piasters"] == 500
          preview = req("GET", f"/api/sessions/{sid1}/preview", admin).json()
          assert preview["products_amount_piasters"] >= 500
          invoice1 = req("POST", f"/api/sessions/{sid1}/end", admin,
              {"payment_method":"CASH","discount_piasters":0}).json()
          assert invoice1["amount_piasters"] >= 500
          assert req("GET", f"/api/invoices/{invoice1['id']}", admin).json()["invoice"]["id"] == invoice1["id"]

          # Cash movements stay pending until admin approval.
          cashin = req("POST", f"/api/shifts/{shift1['id']}/movements", admin,
              {"movement_type":"CASH_IN","amount_piasters":5000,"reason":"QA drawer float"}).json()
          assert cashin["approval_status"] == "PENDING"
          before = req("GET", f"/api/shifts/{shift1['id']}", admin).json()
          assert before["pending_cash_in_piasters"] == 5000
          req("POST", f"/api/shifts/{shift1['id']}/movements/{cashin['id']}/decision", admin,
              {"decision":"APPROVE","admin_username":"admin","admin_password":ADMIN_PASSWORD})
          cashout = req("POST", f"/api/shifts/{shift1['id']}/movements", admin,
              {"movement_type":"CASH_OUT","amount_piasters":700,"reason":"QA expense"}).json()
          req("POST", f"/api/shifts/{shift1['id']}/movements/{cashout['id']}/decision", admin,
              {"decision":"APPROVE","admin_username":"admin","admin_password":ADMIN_PASSWORD})
          shift1_now = req("GET", f"/api/shifts/{shift1['id']}", admin).json()
          assert shift1_now["pending_movement_count"] == 0

          # Closing the drawer must not stop an active PlayStation session.
          live = req("POST", f"/api/stations/{station2}/sessions/start", admin,
              {"session_type":"OPEN","duration_seconds":None,"controller_count":2}).json()
          live_id = live["id"]
          expected = req("GET", f"/api/shifts/{shift1['id']}", admin).json()["expected_cash_piasters"]
          closed1 = req("POST", f"/api/shifts/{shift1['id']}/close", admin,
              {"actual_cash_piasters":expected,"admin_username":"admin","admin_password":ADMIN_PASSWORD}).json()
          assert closed1["status"] == "CLOSED"
          after_close_stations = req("GET", "/api/stations", admin).json()
          assert any((s.get("active_session") or {}).get("id") == live_id for s in after_close_stations)

          # Open next shift and hand it off using the receiver's own password.
          shift2 = req("POST", "/api/shifts/open", staff2_old, {"opening_cash_piasters":0}).json()
          candidates = req("GET", f"/api/shifts/{shift2['id']}/handoff-candidates", staff2_old).json()
          receiver = next(x for x in candidates if x["username"] == "qa-cashier-1")
          req("POST", f"/api/shifts/{shift2['id']}/handoff", staff2_old,
              {"to_user_id":receiver["id"],"password":"wrong-password"}, expected=401)
          handoff = req("POST", f"/api/shifts/{shift2['id']}/handoff", staff2_old,
              {"to_user_id":receiver["id"],"password":STAFF_PASSWORD}).json()
          staff1 = handoff["token"]
          assert handoff["username"] == "qa-cashier-1"
          req("GET", "/api/shifts/current", staff2_old, expected=401)
          req("GET", "/api/shifts/current", staff1_old, expected=401)
          assert req("GET", "/api/shifts/current", staff1).json()["id"] == shift2["id"]

          # The live session can be collected by the new shift.
          invoice2 = req("POST", f"/api/sessions/{live_id}/end", staff1,
              {"payment_method":"CASH","discount_piasters":0}).json()
          assert invoice2["id"] > invoice1["id"]

          # Timed session path.
          timed = req("POST", f"/api/stations/{station1}/sessions/start", staff1,
              {"session_type":"TIMED","duration_seconds":60,"controller_count":2}).json()
          assert timed["session_type"] == "TIMED"
          req("POST", f"/api/sessions/{timed['id']}/extend", staff1, {"seconds":60})
          req("POST", f"/api/sessions/{timed['id']}/end", staff1,
              {"payment_method":"CASH","discount_piasters":0})

          shift2_expected = req("GET", f"/api/shifts/{shift2['id']}", staff1).json()["expected_cash_piasters"]
          req("POST", f"/api/shifts/{shift2['id']}/close", staff1,
              {"actual_cash_piasters":shift2_expected,"admin_username":"admin","admin_password":ADMIN_PASSWORD})

          # Reports preserve sequential settlements and handoff records.
          report = req("GET", "/api/reports/summary", admin).json()
          assert len(report["drawer_settlements"]) >= 2
          assert any(x["shift_id"] == shift2["id"] and x["to_username"] == "qa-cashier-1" for x in report["shift_handoffs"])
          assert report["drawer_settlements"][0]["settlement_number"] > report["drawer_settlements"][-1]["settlement_number"]

          # User reset/disable/enable API.
          users = req("GET", "/api/users", admin).json()
          action_user = next(x for x in users if x["username"] == "qa-actions")
          reset = req("PATCH", f"/api/users/{action_user['id']}", admin, {"password":"QA-New-Password-123!"}).json()
          assert reset["must_change_password"] is True
          disabled = req("PATCH", f"/api/users/{action_user['id']}", admin, {"is_active":False}).json()
          assert disabled["is_active"] is False
          enabled = req("PATCH", f"/api/users/{action_user['id']}", admin, {"is_active":True}).json()
          assert enabled["is_active"] is True

          # Backup and ROOT-only diagnostics.
          backup = req("POST", "/api/backups", admin).json()
          assert backup["filename"].endswith(".db") and backup["size"] > 0
          assert any(x["filename"] == backup["filename"] for x in req("GET", "/api/backups", admin).json())
          logs = req("GET", "/api/root/system-logs", root).json()
          assert isinstance(logs, list) and len(logs) > 0

          # Embedded Voltra page and ROOT proxy.
          page = req("GET", "/voltra-console").text
          assert "PlayZone Manager" in page and "/api/root/voltra-console" in page
          overview = req("GET", "/api/root/voltra-console/overview", root)
          assert overview.status_code == 200

          print("INSTALLED_BACKEND_COMPREHENSIVE_OK")
          '@ | Set-Content (Join-Path $env:RUNNER_TEMP 'installed_backend_acceptance.py') -Encoding UTF8

          python (Join-Path $env:RUNNER_TEMP 'installed_backend_acceptance.py')

      - name: Installed Electron UI acceptance test
        shell: pwsh
        run: |
          @'
          const { _electron: electron } = require('playwright-core');

          const installRoot = 'C:\\Program Files\\PlayZone Manager';
          const exe = installRoot + '\\desktop-runtime\\PlayZone Manager.exe';
          const shellDir = installRoot + '\\desktop-shell';
          const ADMIN_PASSWORD = 'Admin-Acceptance-123!';

          (async () => {
            const app = await electron.launch({
              executablePath: exe,
              args: [shellDir],
              env: { ...process.env }
            });
            const page = await app.firstWindow();
            await page.waitForLoadState('domcontentloaded');

            await page.getByLabel('اسم المستخدم').fill('admin');
            await page.getByLabel('كلمة المرور').fill(ADMIN_PASSWORD);
            await page.getByRole('button', { name: 'دخول' }).click();
            await page.getByText('PlayZone', { exact: true }).waitFor({ timeout: 15000 });

            // No shift means session start is disabled for ADMIN too.
            await page.getByText('لا توجد وردية مفتوحة', { exact: true }).waitFor();
            if (!(await page.getByRole('button', { name: 'بدء جلسة' }).first().isDisabled())) {
              throw new Error('Start session enabled without shift');
            }

            // Open shift and start a real session.
            await page.getByRole('button', { name: 'فتح وردية', exact: true }).click();
            await page.getByRole('heading', { name: 'فتح وردية' }).waitFor();
            await page.getByRole('button', { name: 'فتح الوردية' }).click();
            await page.getByText('وردية مفتوحة', { exact: true }).waitFor({ timeout: 15000 });

            const chip = page.locator('.shift-chip.open');
            const chipText = await chip.innerText();
            if (!chipText.includes('Administrator')) throw new Error('Shift chip does not show employee name');
            if (chipText.includes('رصيد الدرج') || chipText.includes('ج.م')) throw new Error('Shift chip leaks financial balance');

            await page.getByRole('button', { name: 'بدء جلسة' }).first().click();
            await page.getByRole('heading', { name: /بدء جلسة/ }).waitFor();
            await page.getByRole('button', { name: 'تأكيد البدء' }).click();
            await page.waitForFunction(() => document.body.innerText.includes('إنهاء الجلسة'), null, { timeout: 15000 });

            // Privacy eye hides dashboard revenue and gameplay values.
            const eye = page.locator('.pz-privacy-toggle').first();
            await eye.waitFor();
            await eye.click();
            await page.waitForFunction(() =>
              [...document.querySelectorAll('.stats .stat strong')].filter(x => x.textContent.trim() === '••••••').length >= 2
            );
            await eye.click();

            // Sidebar is scrollable on short-height layouts.
            const scrollInfo = await page.evaluate(() => {
              const nav = document.querySelector('.sidebar.pz-auto-sidebar > nav');
              const style = nav ? getComputedStyle(nav) : null;
              return { exists: !!nav, overflowY: style?.overflowY || '', scrollHeight: nav?.scrollHeight || 0, clientHeight: nav?.clientHeight || 0 };
            });
            if (!scrollInfo.exists || scrollInfo.overflowY !== 'auto') {
              throw new Error('Sidebar navigation is not configured for vertical scrolling');
            }

            // Employee reset/disable/enable through real in-app modals.
            const usersNav = page.getByRole('button', { name: 'الموظفين', exact: true });
            await usersNav.evaluate(el => el.click());
            await page.getByRole('heading', { name: 'حسابات الموظفين' }).waitFor();
            let row = page.locator('tr', { hasText: 'qa-actions' });
            await row.getByRole('button', { name: 'إعادة تعيين كلمة المرور' }).click();
            await page.getByRole('heading', { name: /إعادة تعيين كلمة المرور - qa-actions/ }).waitFor();
            await page.getByLabel('كلمة المرور الجديدة').fill('QA-UI-Password-456!');
            await page.locator('.modal').getByRole('button', { name: 'تعيين كلمة المرور', exact: true }).click();
            await page.waitForFunction(() => {
              const row = [...document.querySelectorAll('tr')].find(r => r.innerText.includes('qa-actions'));
              return row && row.innerText.includes('مطلوب تغيير كلمة المرور');
            });

            row = page.locator('tr', { hasText: 'qa-actions' });
            await row.getByRole('button', { name: 'تعطيل' }).click();
            await page.getByRole('heading', { name: 'تعطيل الموظف' }).waitFor();
            await page.getByRole('button', { name: 'تأكيد التعطيل' }).click();
            await page.waitForFunction(() => {
              const row = [...document.querySelectorAll('tr')].find(r => r.innerText.includes('qa-actions'));
              return row && row.innerText.includes('معطل');
            });
            row = page.locator('tr', { hasText: 'qa-actions' });
            await row.getByRole('button', { name: 'تفعيل' }).click();
            await page.getByRole('heading', { name: 'تفعيل الموظف' }).waitFor();
            await page.getByRole('button', { name: 'تأكيد التفعيل' }).click();

            // Voltra is intentionally ROOT-only. Switch this installed Electron
            // session to ROOT, then exercise the real internal Voltra navigation.
            await page.evaluate(async () => {
              const r = await fetch('/api/auth/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username: 'root', password: 'Root-Acceptance-123!' })
              });
              if (!r.ok) throw new Error('ROOT login failed before Voltra UI test: ' + await r.text());
              const data = await r.json();
              localStorage.setItem('playzone_token', data.token);
              location.href = '/';
            });
            await page.waitForLoadState('domcontentloaded');
            await page.getByText('Root / مالك النظام', { exact: true }).waitFor({ timeout: 15000 });

            const clickedVoltraNav = await page.evaluate(() => {
              const buttons = [...document.querySelectorAll('button')];
              const target = buttons.find(el => (el.textContent || '').includes('Voltra'));
              if (!target) return false;
              target.click();
              return true;
            });
            if (!clickedVoltraNav) throw new Error('Voltra navigation button was not found in the rendered UI');
            await page.getByText('ربط أجهزة PlayStation بمخارج Voltra').waitFor({ timeout: 15000 });
            const voltraButton = page.getByRole('link', { name: 'لوحة Voltra' });
            await voltraButton.click();
            await page.waitForURL(/\/voltra-console$/);
            await page.locator('button[data-page="network"]').click();
            if (!(await page.locator('#page-network').evaluate(el => el.classList.contains('active')))) {
              throw new Error('Voltra network tab did not activate');
            }
            await page.locator('button[data-page="mapping"]').click();
            if (!(await page.locator('#page-mapping').evaluate(el => el.classList.contains('active')))) {
              throw new Error('Voltra mapping tab did not activate');
            }
            await page.getByRole('link', { name: /العودة إلى PlayZone/ }).click();
            await page.waitForURL('http://127.0.0.1:8000/');

            // Clean the UI-created live session and shift before uninstall.
            await page.evaluate(async ({ password }) => {
              const token = localStorage.getItem('playzone_token');
              const headers = { Authorization: 'Bearer ' + token, 'Content-Type': 'application/json' };
              const stations = await fetch('/api/stations', { headers }).then(r => r.json());
              for (const station of stations) {
                if (station.active_session) {
                  const r = await fetch('/api/sessions/' + station.active_session.id + '/end', {
                    method: 'POST', headers,
                    body: JSON.stringify({ payment_method: 'CASH', discount_piasters: 0 })
                  });
                  if (!r.ok) throw new Error(await r.text());
                }
              }
              const shift = await fetch('/api/shifts/current', { headers }).then(r => r.json());
              if (shift) {
                const detail = await fetch('/api/shifts/' + shift.id, { headers }).then(r => r.json());
                const r = await fetch('/api/shifts/' + shift.id + '/close', {
                  method: 'POST', headers,
                  body: JSON.stringify({
                    actual_cash_piasters: detail.expected_cash_piasters,
                    admin_username: 'admin',
                    admin_password: password
                  })
                });
                if (!r.ok) throw new Error(await r.text());
              }
            }, { password: ADMIN_PASSWORD });

            console.log('INSTALLED_ELECTRON_UI_OK');
            await app.close();
          })().catch(err => {
            console.error(err);
            process.exit(1);
          });
          '@ | Set-Content (Join-Path $env:RUNNER_TEMP 'installed_electron_acceptance.cjs') -Encoding UTF8

          $env:NODE_PATH = (Join-Path $PWD 'node_modules')
          node (Join-Path $env:RUNNER_TEMP 'installed_electron_acceptance.cjs')

      - name: Real uninstall preserves client data
        shell: pwsh
        run: |
          $installRoot = Join-Path $env:ProgramFiles 'PlayZone Manager'
          $dataRoot = Join-Path $env:ProgramData 'PlayZone Manager'
          $marker = Join-Path $dataRoot 'secure-data\qa-preserve-marker.txt'
          'preserve-me' | Set-Content -LiteralPath $marker -Encoding ASCII

          Get-Process -Name 'PlayZone Manager' -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File (Join-Path $installRoot 'Uninstall-PlayZone-Service.ps1')
          if ($LASTEXITCODE -ne 0) { throw "Uninstall failed: $LASTEXITCODE" }
          Start-Sleep -Seconds 3

          if (Get-Service -Name PlayZoneManager -ErrorAction SilentlyContinue) { throw 'Service still exists after uninstall.' }
          if (Test-Path -LiteralPath $installRoot) { throw 'Program Files install folder still exists after uninstall.' }
          if (-not (Test-Path -LiteralPath (Join-Path $dataRoot 'secure-data\playzone.db'))) { throw 'Normal uninstall removed the database.' }
          if (-not (Test-Path -LiteralPath $marker)) { throw 'Normal uninstall did not preserve client data.' }

          foreach ($shortcut in @(
            (Join-Path ([Environment]::GetFolderPath('CommonDesktopDirectory')) 'PlayZone Manager.lnk'),
            (Join-Path ([Environment]::GetFolderPath('CommonPrograms')) 'PlayZone Manager.lnk'),
            (Join-Path ([Environment]::GetFolderPath('CommonStartup')) 'PlayZone Manager.lnk')
          )) {
            if (Test-Path -LiteralPath $shortcut) { throw "Shortcut remains after uninstall: $shortcut" }
          }
          Write-Host 'REAL_UNINSTALL_PRESERVE_DATA_OK'

      - name: Cleanup QA data with full uninstall mode
        shell: pwsh
        run: |
          $dataRoot = Join-Path $env:ProgramData 'PlayZone Manager'
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File package\Uninstall-PlayZone-Service.ps1 -RemoveData
          if ($LASTEXITCODE -ne 0) { throw "Full cleanup uninstaller failed: $LASTEXITCODE" }
          if (Test-Path -LiteralPath $dataRoot) { throw 'ProgramData remains after -RemoveData cleanup.' }
          Write-Host 'REAL_UNINSTALL_REMOVE_DATA_OK'

      - name: Final client package audit
        shell: pwsh
        run: |
          $required = @(
            'package\Install-PlayZone-Service.bat',
            'package\Install-PlayZone-Service.ps1',
            'package\Uninstall-PlayZone-Service.bat',
            'package\Uninstall-PlayZone-Service.ps1',
            'package\Bootstrap-Portable.ps1',
            'package\offline-runtime\python-3.12.6-embed-amd64.zip',
            'package\offline-runtime\wheels\typing_inspection-0.4.4-py3-none-any.whl',
            'package\desktop-runtime\electron-v44.4.5-win32-x64.zip',
            'package\CLIENT-ACCEPTANCE-TEST-AR.txt',
            'package\VERSION.txt'
          )
          foreach ($path in $required) {
            if (-not (Test-Path -LiteralPath $path)) { throw "Required client file missing: $path" }
          }

          if ((Get-Content package\VERSION.txt -Raw).Trim() -ne '0.34.4') { throw 'Packaged version mismatch.' }
          if (Test-Path package\.runtime) { throw 'QA runtime leaked into final package.' }
          if (Test-Path package\backend\app\drinks.py) { throw 'Drinks module leaked into package.' }

          $bad = Get-ChildItem -LiteralPath package -Recurse -Force | Where-Object {
            $_.Name -match 'abo_aYmAn|abo-ayman|abo-addon|__pycache__|\.pytest_cache' -or
            $_.Extension -in @('.db','.sqlite','.sqlite3','.log','.pyc','.pyo')
          }
          if ($bad) { throw "Unexpected client package content: $($bad.FullName -join ', ')" }

          $frontend = Get-Content package\frontend\dist\assets\index-v031.js -Raw
          $chipStart = $frontend.IndexOf('function lt({shift:e,onOpen:t,onManage:n})')
          $chip = $frontend.Substring($chipStart, [Math]::Min(1000, $frontend.Length - $chipStart))
          if ($chip.Contains('رصيد الدرج') -or $chip.Contains('expected_cash_piasters')) { throw 'Packaged shift chip leaks drawer balance.' }

          $electronHash = (Get-FileHash package\desktop-runtime\electron-v44.4.5-win32-x64.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($electronHash -ne '11c395820a5aaa8ebcc0686b476d0ac98a730274ebfbdc8cf5538a7c2815cb5d') {
            throw "Packaged Electron checksum mismatch: $electronHash"
          }
          Write-Host 'FINAL_PACKAGE_AUDIT_OK'

      - name: Create final client ZIP
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path out | Out-Null
          $zip = 'out\PlayZone-Manager-v0.34.4-Client-Acceptance-Full.zip'
          Compress-Archive -Path package\* -DestinationPath $zip -CompressionLevel Optimal -Force
          $hash = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          $hash | Set-Content "$zip.sha256" -Encoding ASCII
          Write-Host "CLIENT_FINAL_SHA256=$hash"

      - name: Upload final client package
        uses: actions/upload-artifact@v4
        with:
          name: PlayZone-Manager-v0.34.4-Client-Acceptance-Full
          path: out/*
          if-no-files-found: error
          retention-days: 30
