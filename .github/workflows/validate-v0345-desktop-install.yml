name: Validate PlayZone v0.34.5 Desktop Install

on:
  push:
    branches:
      - fix/v0345-detached-launch-shortcut
  workflow_dispatch:

permissions:
  contents: read

jobs:
  install-shortcut-detach:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate release source
        shell: pwsh
        run: |
          python -m py_compile backend/app/main.py backend/app/windows_service.py backend/app/root_setup.py
          node --check desktop-shell/main.js
          node --check frontend/dist/assets/index-v031.js

          if ((Get-Content VERSION.txt -Raw).Trim() -ne '0.34.5') { throw 'VERSION.txt is not 0.34.5.' }
          if (-not (Get-Content backend/app/main.py -Raw).Contains('version="0.34.5"')) { throw 'Backend version mismatch.' }
          if (-not (Get-Content desktop-shell/package.json -Raw).Contains('"version": "0.34.5"')) { throw 'Desktop version mismatch.' }
          if (-not (Get-Content frontend/dist/index.html -Raw).Contains('0345-shortcut')) { throw 'Frontend cache key mismatch.' }

          $installer = Get-Content Install-PlayZone-Service.ps1 -Raw
          foreach ($needle in @(
            "SpecialFolders.Item('Desktop')",
            "SpecialFolders.Item('AllUsersDesktop')",
            'Could not create a verified PlayZone Manager shortcut',
            'Shell.Application',
            'Opening PlayZone Manager Desktop independently'
          )) {
            if (-not $installer.Contains($needle)) { throw "Installer fix marker missing: $needle" }
          }

          foreach ($file in @('Bootstrap-Portable.ps1','Install-PlayZone-Service.ps1','Uninstall-PlayZone-Service.ps1')) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($file,[ref]$tokens,[ref]$errors) | Out-Null
            if ($errors.Count -gt 0) { throw "$file syntax error: $($errors[0].Message)" }
          }

      - name: Prepare clean package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force package | Out-Null
          foreach ($dir in @('backend','frontend','offline-runtime','desktop-shell','desktop-runtime')) {
            Copy-Item -LiteralPath $dir -Destination (Join-Path package $dir) -Recurse -Force
          }
          foreach ($file in @(
            'Bootstrap-Portable.ps1',
            'Install-PlayZone-Service.bat',
            'Install-PlayZone-Service.ps1',
            'Launch-PlayZone.ps1',
            'Uninstall-PlayZone-Service.bat',
            'Uninstall-PlayZone-Service.ps1',
            'Setup-Root-Password.bat',
            'Setup-Root-Password.ps1',
            'PlayStation.ico',
            'VERSION.txt'
          )) {
            Copy-Item -LiteralPath $file -Destination package -Force
          }

          Get-ChildItem package -Recurse -Directory -Force |
            Where-Object { $_.Name -in @('__pycache__','.pytest_cache','.git','.github','node_modules') } |
            Sort-Object FullName -Descending |
            Remove-Item -Recurse -Force -ErrorAction SilentlyContinue
          Get-ChildItem package -Recurse -File -Force |
            Where-Object { $_.Extension -in @('.pyc','.pyo','.log','.db','.sqlite','.sqlite3') } |
            Remove-Item -Force -ErrorAction SilentlyContinue

          if (-not (Test-Path 'package\offline-runtime\wheels\typing_inspection-0.4.4-py3-none-any.whl')) {
            throw 'typing_inspection missing after packaging.'
          }

      - name: Bundle verified Electron
        shell: pwsh
        run: |
          $version = '44.4.5'
          $name = "electron-v$version-win32-x64.zip"
          $url = "https://github.com/electron/electron/releases/download/v$version/$name"
          $expected = '11c395820a5aaa8ebcc0686b476d0ac98a730274ebfbdc8cf5538a7c2815cb5d'
          $dest = Join-Path $PWD "package\desktop-runtime\$name"
          if (Test-Path $dest) { Remove-Item $dest -Force }
          Invoke-WebRequest -UseBasicParsing -Uri $url -OutFile $dest
          $actual = (Get-FileHash $dest -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw "Electron checksum mismatch: $actual" }

      - name: Prepare fresh ROOT state
        shell: pwsh
        run: |
          $dataRoot = Join-Path $env:ProgramData 'PlayZone Manager'
          $installRoot = Join-Path $env:ProgramFiles 'PlayZone Manager'
          Stop-Process -Name 'PlayZone Manager' -Force -ErrorAction SilentlyContinue
          Stop-Service PlayZoneManager -Force -ErrorAction SilentlyContinue
          & sc.exe delete PlayZoneManager 2>$null | Out-Null
          Start-Sleep -Milliseconds 700
          Remove-Item $installRoot -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item $dataRoot -Recurse -Force -ErrorAction SilentlyContinue

          $secure = Join-Path $dataRoot 'secure-data'
          New-Item -ItemType Directory -Force $secure | Out-Null
          $env:PLAYZONE_DB_PATH = Join-Path $secure 'playzone.db'

          python -m pip install -r backend/requirements.txt
          Push-Location backend
          'Root-Shortcut-Test-123!' | python -m app.root_setup set
          if ($LASTEXITCODE -ne 0) { throw 'ROOT preconfiguration failed.' }
          Pop-Location

      - name: Run real interactive installer and let terminal exit
        shell: pwsh
        run: |
          # ROOT is already initialized, so the only Read-Host is the final "Press Enter".
          # Pipe one blank line so the installer terminal exits exactly like the user closing it after completion.
          $psi = New-Object System.Diagnostics.ProcessStartInfo
          $psi.FileName = 'powershell.exe'
          $psi.Arguments = '-NoProfile -ExecutionPolicy Bypass -File "' + (Join-Path $PWD 'package\Install-PlayZone-Service.ps1') + '"'
          $psi.WorkingDirectory = $PWD
          $psi.UseShellExecute = $false
          $psi.RedirectStandardInput = $true
          # Keep stdout/stderr attached to the runner. Redirecting them without
          # asynchronously draining the pipes can deadlock a verbose installer.
          $p = New-Object System.Diagnostics.Process
          $p.StartInfo = $psi
          [void]$p.Start()
          $p.StandardInput.WriteLine('')
          $p.StandardInput.Close()
          if (-not $p.WaitForExit(180000)) {
            $p.Kill()
            throw 'Installer did not exit.'
          }
          if ($p.ExitCode -ne 0) { throw "Installer failed with exit code $($p.ExitCode)" }

          # The installer PowerShell process is now gone. Give the desktop client time to prove independence.
          Start-Sleep -Seconds 4

          $svc = Get-Service PlayZoneManager -ErrorAction Stop
          if ($svc.Status -ne 'Running') { throw "Service stopped when installer terminal exited: $($svc.Status)" }

          $proc = Get-Process -Name 'PlayZone Manager' -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $proc) { throw 'PlayZone Manager desktop process exited with the installer terminal.' }
          Write-Host "DETACHED_DESKTOP_PROCESS_OK PID=$($proc.Id)"

      - name: Verify desktop shortcut and launch independently
        shell: pwsh
        run: |
          $installRoot = Join-Path $env:ProgramFiles 'PlayZone Manager'
          $expectedExe = Join-Path $installRoot 'desktop-runtime\PlayZone Manager.exe'
          $wsh = New-Object -ComObject WScript.Shell
          $folders = @(
            $wsh.SpecialFolders.Item('Desktop'),
            [Environment]::GetFolderPath('DesktopDirectory'),
            $wsh.SpecialFolders.Item('AllUsersDesktop'),
            [Environment]::GetFolderPath('CommonDesktopDirectory')
          ) | Where-Object { $_ } | Select-Object -Unique

          $links = @()
          foreach ($folder in $folders) {
            $candidate = Join-Path $folder 'PlayZone Manager.lnk'
            if (Test-Path -LiteralPath $candidate) { $links += $candidate }
          }
          $links = @($links | Select-Object -Unique)
          if ($links.Count -lt 1) {
            throw "No PlayZone Manager.lnk found in resolved desktop folders: $($folders -join '; ')"
          }

          foreach ($link in $links) {
            $s = $wsh.CreateShortcut($link)
            if ($s.TargetPath -ne $expectedExe) {
              throw "Shortcut target is wrong. Link=$link Target=$($s.TargetPath) Expected=$expectedExe"
            }
            if ($s.Arguments -notmatch 'desktop-shell') {
              throw "Shortcut desktop-shell argument missing: $link"
            }
            Write-Host "VERIFIED_SHORTCUT=$link"
          }

          # Kill the installer-launched window, then launch only from the desktop shortcut
          # through a short-lived child PowerShell. The child exits; PlayZone must stay running.
          Stop-Process -Name 'PlayZone Manager' -Force -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 1

          $linkToTest = $links[0]
          $escaped = $linkToTest.Replace("'","''")
          $child = Start-Process powershell.exe -ArgumentList @(
            '-NoProfile','-Command',
            "Start-Process -FilePath '$escaped'"
          ) -PassThru
          $child.WaitForExit()
          Start-Sleep -Seconds 4

          if (-not (Get-Process -Name 'PlayZone Manager' -ErrorAction SilentlyContinue)) {
            throw 'Desktop shortcut launch died after its launcher terminal exited.'
          }
          if ((Get-Service PlayZoneManager).Status -ne 'Running') {
            throw 'Windows Service is not running after shortcut launch.'
          }
          $h = Invoke-RestMethod http://127.0.0.1:8000/api/health -TimeoutSec 5
          if (-not $h.ok) { throw 'Health endpoint failed after detached shortcut launch.' }
          Write-Host 'SHORTCUT_AND_TERMINAL_INDEPENDENCE_OK'

      - name: Verify uninstall
        shell: pwsh
        run: |
          $installRoot = Join-Path $env:ProgramFiles 'PlayZone Manager'
          $dataRoot = Join-Path $env:ProgramData 'PlayZone Manager'
          $sentinel = Join-Path $dataRoot 'secure-data\preserve-after-uninstall.txt'
          'keep' | Set-Content $sentinel -Encoding ASCII

          powershell.exe -NoProfile -ExecutionPolicy Bypass -File (Join-Path $installRoot 'Uninstall-PlayZone-Service.ps1')
          if ($LASTEXITCODE -ne 0) { throw "Uninstall failed: $LASTEXITCODE" }
          if (Get-Service PlayZoneManager -ErrorAction SilentlyContinue) { throw 'Service remained after uninstall.' }
          if (Test-Path $installRoot) { throw 'Install folder remained after uninstall.' }
          if (-not (Test-Path $sentinel)) { throw 'Default uninstall did not preserve data.' }

          powershell.exe -NoProfile -ExecutionPolicy Bypass -File package\Uninstall-PlayZone-Service.ps1 -RemoveData
          if ($LASTEXITCODE -ne 0) { throw "RemoveData uninstall failed: $LASTEXITCODE" }
          if (Test-Path $dataRoot) { throw 'ProgramData remained after RemoveData.' }
          Write-Host 'UNINSTALL_OK'
