name: Apply abo_aYmAn branding

on:
  push:
    branches: [abo_aYmAn]
    paths:
      - ".github/workflows/brand-abo-ayman.yml"

permissions:
  contents: write

jobs:
  brand:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply branding
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          js_path = Path("frontend/dist/assets/index-v031.js")
          css_path = Path("frontend/dist/assets/index-v031.css")
          html_path = Path("frontend/dist/index.html")

          js = js_path.read_text(encoding="utf-8")

          sidebar_old = "(0,j.jsxs)(`div`,{className:`brand`,children:[(0,j.jsx)(`span`,{className:`brand-mark`,children:(0,j.jsx)(_e,{})}),(0,j.jsxs)(`div`,{children:[(0,j.jsx)(`strong`,{children:`PlayZone`}),(0,j.jsx)(`small`,{children:`MANAGER`})]})]})"
          sidebar_new = "(0,j.jsx)(`div`,{className:`brand abo-brand`,children:(0,j.jsx)(`img`,{className:`abo-brand-logo`,src:`/abo-ayman-logo.png`,alt:`abo_aYmAn - PlayZone Manager`})})"
          if sidebar_old not in js:
              raise SystemExit("Sidebar brand block not found")
          js = js.replace(sidebar_old, sidebar_new, 1)

          login_start = "(0,j.jsx)(`div`,{className:`brand-mark login-ps-brand`"
          login_end = "}),(0,j.jsx)(`h1`,{children:`PlayZone Manager`})"
          ls = js.find(login_start)
          le = js.find(login_end, ls)
          if ls < 0 or le < 0:
              raise SystemExit("Login brand block not found")
          login_replacement = "(0,j.jsx)(`div`,{className:`abo-login-brand`,children:(0,j.jsx)(`img`,{className:`abo-login-logo`,src:`/abo-ayman-logo.png`,alt:`abo_aYmAn - PlayZone Manager`})}),(0,j.jsx)(`h1`,{children:`abo_aYmAn`})"
          js = js[:ls] + login_replacement + js[le + len(login_end):]

          activation_old = "(0,j.jsx)(`div`,{className:`brand-mark`,children:(0,j.jsx)(Ie,{})}),(0,j.jsx)(`h1`,{children:`تفعيل PlayZone`})"
          activation_new = "(0,j.jsx)(`div`,{className:`abo-login-brand`,children:(0,j.jsx)(`img`,{className:`abo-login-logo`,src:`/abo-ayman-logo.png`,alt:`abo_aYmAn - PlayZone Manager`})}),(0,j.jsx)(`h1`,{children:`تفعيل abo_aYmAn`})"
          if activation_old not in js:
              raise SystemExit("Activation brand block not found")
          js = js.replace(activation_old, activation_new, 1)

          password_old = "(0,j.jsx)(`div`,{className:`brand-mark`,children:(0,j.jsx)(xe,{})}),(0,j.jsx)(`h1`,{children:`تغيير كلمة المرور`})"
          password_new = "(0,j.jsx)(`div`,{className:`abo-login-brand`,children:(0,j.jsx)(`img`,{className:`abo-login-logo`,src:`/abo-ayman-logo.png`,alt:`abo_aYmAn - PlayZone Manager`})}),(0,j.jsx)(`h1`,{children:`تغيير كلمة المرور`})"
          if password_old in js:
              js = js.replace(password_old, password_new, 1)

          js = js.replace("children:[`PLAYZONE / `,We]", "children:[`abo_aYmAn / `,We]", 1)
          js = js.replace("children:o===`home`?`إدارة الجلسات والأجهزة والمبيعات من شاشة واحدة`:`PlayZone Manager`", "children:o===`home`?`إدارة الجلسات والأجهزة والمبيعات من شاشة واحدة`:`abo_aYmAn`", 1)
          js = js.replace("(0,j.jsx)(`h2`,{children:`PlayZone`})", "(0,j.jsx)(`h2`,{children:`abo_aYmAn`})", 1)
          js_path.write_text(js, encoding="utf-8")

          css = css_path.read_text(encoding="utf-8")
          brand_css = ".abo-brand{justify-content:flex-start;padding:0 2px 18px}.abo-brand-logo{display:block;width:202px;max-width:100%;height:auto;border-radius:7px;object-fit:contain}.abo-login-brand{display:flex;justify-content:center;align-items:center;margin:0 auto 10px}.abo-login-logo{display:block;width:202px;max-width:82%;height:auto;border-radius:8px;object-fit:contain}.login-panel .abo-login-logo{margin:0 auto}"
          if brand_css not in css:
              css += brand_css
          css_path.write_text(css, encoding="utf-8")

          html = html_path.read_text(encoding="utf-8")
          html = html.replace("<title>PlayZone Manager</title>", "<title>abo_aYmAn — PlayZone Manager</title>")
          html_path.write_text(html, encoding="utf-8")

          Path("BRAND.txt").write_text("abo_aYmAn\nPlayZone Manager branded edition\nBase version: 0.31\n", encoding="utf-8")
          Path("BRANDING-abo_aYmAn.md").write_text(
              "# abo_aYmAn branded edition\n\n"
              "This branch is a visually branded copy of PlayZone Manager v0.31.\n"
              "The original main branch remains unchanged.\n"
              "Backend service names and data paths remain compatible with PlayZone Manager.\n",
              encoding="utf-8",
          )
          PY

      - name: Validate branded files
        shell: bash
        run: |
          grep -q "abo_aYmAn" frontend/dist/index.html
          grep -q "abo-ayman-logo.png" frontend/dist/assets/index-v031.js
          grep -q "abo_aYmAn" frontend/dist/assets/index-v031.js
          test -f frontend/dist/abo-ayman-logo.png
          test -f BRAND.txt

      - name: Commit branded edition
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm --ignore-unmatch .github/workflows/brand-abo-ayman.yml
          git add -A
          git commit -m "Create abo_aYmAn branded edition"
          git push origin HEAD:abo_aYmAn
