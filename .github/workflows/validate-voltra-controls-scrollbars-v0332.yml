name: Validate Voltra Controls and Scrollbars v0.33.2

on:
  push:
    branches:
      - fix/voltra-controls-scrollbars
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate source syntax
        run: |
          python -m py_compile backend/app/main.py backend/voltra_local/dashboard.py
          node --check frontend/dist/playzone-responsive.js
          grep -q '0.33.2' VERSION.txt
          grep -q '033-ui4' frontend/dist/index.html

      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt

      - name: Generate actual embedded Voltra HTML
        working-directory: backend
        run: |
          python - <<'PY'
          from pathlib import Path
          from app.main import _embedded_voltra_console_html
          html = _embedded_voltra_console_html()
          assert "playzoneMode" in html
          assert "localStorage.getItem('playzone_token')" in html
          assert "/api/root/voltra-console" in html
          assert "Voltra API Token" in html
          assert "playzoneMode" in html
          assert "pzVoltraScrollTrack" in html
          Path("../voltra-test.html").write_text(html, encoding="utf-8")
          print("generated", len(html))
          PY

      - name: Verify all scrollbar surfaces use the same skin
        run: |
          grep -q '\*:not(html):not(body)::-webkit-scrollbar' frontend/dist/playzone-responsive.css
          grep -q '#pz-left-scroll-track' frontend/dist/playzone-responsive.css
          grep -q 'scrollbar-color:#365d7d transparent' backend/voltra_local/dashboard.py
          grep -q '#pzVoltraScrollTrack' backend/voltra_local/dashboard.py

      - name: Install Playwright Chromium
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Run real Chromium interaction test
        run: |
          cat > voltra-browser-test.cjs <<'NODE'
          const fs = require('fs');
          const http = require('http');
          const { chromium } = require('playwright');

          const html = fs.readFileSync('voltra-test.html', 'utf8');
          const apiRequests = [];

          function overview() {
            const strips = [];
            for (let i = 1; i <= 8; i++) {
              const mac = 'AA:BB:CC:DD:EE:' + String(i).padStart(2, '0');
              strips.push({
                mac,
                name: 'مشترك ' + i,
                online: true,
                managed: true,
                enabled: true,
                state: 'active',
                model: 'MTTL-W01',
                firmware_version: '1.0',
                last_ip: '192.168.1.' + (100 + i),
                last_seen_at: new Date().toISOString(),
                mapped_count: i === 1 ? 1 : 0,
                total_power_w: 25.4,
                outlets: [1,2,3,4].map(ch => ({channel: ch, relay: false, power_w: ch === 1 ? 25.4 : 0}))
              });
            }
            return {
              mode: 'demo',
              strips,
              ps4_devices: [{id: '1', name: 'PS4 1'}],
              mappings: {'1': {mac: 'AA:BB:CC:DD:EE:01', outlet: 1}},
              summary: {
                active_strips: 8,
                online_strips: 8,
                pending_strips: 0,
                mapped_devices: 1,
                total_power_w: 203.2
              }
            };
          }

          const server = http.createServer((req, res) => {
            const url = new URL(req.url, 'http://127.0.0.1:8765');
            if (url.pathname === '/voltra-console') {
              res.writeHead(200, {'content-type': 'text/html; charset=utf-8', 'cache-control': 'no-store'});
              return res.end(html);
            }
            if (url.pathname === '/') {
              res.writeHead(200, {'content-type': 'text/html; charset=utf-8'});
              return res.end('<h1 id="home">PlayZone Home</h1>');
            }
            if (url.pathname.startsWith('/api/root/voltra-console/')) {
              let body = '';
              req.on('data', c => body += c);
              req.on('end', () => {
                apiRequests.push({method: req.method, path: url.pathname, auth: req.headers.authorization || '', body});
                if (req.headers.authorization !== 'Bearer root-token') {
                  res.writeHead(401, {'content-type':'application/json'});
                  return res.end(JSON.stringify({detail:'Root role required'}));
                }
                res.writeHead(200, {'content-type':'application/json'});
                if (url.pathname.endsWith('/overview')) return res.end(JSON.stringify(overview()));
                if (req.method === 'DELETE') return res.end(JSON.stringify({ok:true, removed_mappings:[]}));
                if (url.pathname.includes('/replace')) return res.end(JSON.stringify({ok:true, transferred_devices:['1']}));
                return res.end(JSON.stringify({ok:true}));
              });
              return;
            }
            res.writeHead(404, {'content-type':'text/plain'});
            res.end('not found');
          });

          (async () => {
            await new Promise(resolve => server.listen(8765, '127.0.0.1', resolve));
            const browser = await chromium.launch({headless:true});
            const context = await browser.newContext();
            await context.addInitScript(() => localStorage.setItem('playzone_token', 'root-token'));
            const page = await context.newPage();
            const pageErrors = [];
            page.on('pageerror', err => pageErrors.push(err.message));
            page.on('console', msg => {
              if (msg.type() === 'error') pageErrors.push('console: ' + msg.text());
            });
            page.on('dialog', dialog => dialog.accept());

            try {
              await page.goto('http://127.0.0.1:8765/voltra-console', {waitUntil:'domcontentloaded'});
              await page.waitForFunction(() => document.getElementById('connectionBadge')?.textContent.includes('Voltra متصل'));
              await page.waitForSelector('#managedStrips .strip');

              // Tabs must be actually clickable.
              await page.locator('button.tab[data-page="mapping"]').click();
              if (!(await page.locator('#page-mapping').evaluate(el => el.classList.contains('active')))) {
                throw new Error('Mapping tab did not activate');
              }
              await page.locator('button.tab[data-page="discover"]').click();
              if (!(await page.locator('#page-discover').evaluate(el => el.classList.contains('active')))) {
                throw new Error('Discover tab did not activate');
              }
              await page.locator('button.tab[data-page="strips"]').click();

              // Rename control must open and PUT through PlayZone ROOT proxy.
              await page.locator('#managedStrips .btn.ghost.sm', {hasText:'تسمية'}).first().click();
              await page.waitForSelector('#renameModal.show');
              await page.locator('#renameValue').fill('مشترك اختبار');
              const renameReq = page.waitForRequest(r =>
                r.method() === 'PUT' &&
                r.url().includes('/api/root/voltra-console/strips/AA:BB:CC:DD:EE:01')
              );
              await page.locator('#renameModal .btn.blue', {hasText:'حفظ'}).click();
              const rr = await renameReq;
              if (rr.headers()['authorization'] !== 'Bearer root-token') throw new Error('Rename request missing PlayZone token');

              // Power control must be clickable and POST through the ROOT proxy.
              const powerReq = page.waitForRequest(r =>
                r.method() === 'POST' &&
                r.url().includes('/api/root/voltra-console/strips/AA:BB:CC:DD:EE:01/outlets/1/state')
              );
              await page.locator('#managedStrips .outlet').first().locator('button', {hasText:'تشغيل'}).click();
              const pr = await powerReq;
              if (pr.headers()['authorization'] !== 'Bearer root-token') throw new Error('Power request missing PlayZone token');

              // Disable button also proves dynamic rendered controls receive clicks.
              const disableReq = page.waitForRequest(r =>
                r.method() === 'POST' &&
                r.url().includes('/api/root/voltra-console/strips/AA:BB:CC:DD:EE:01/enabled')
              );
              await page.locator('#managedStrips .strip').first().locator('button', {hasText:'تعطيل مؤقت'}).click();
              await disableReq;

              // PlayZone-mode left page scrollbar must exist and be positioned left.
              const scrollState = await page.evaluate(() => {
                const track = document.getElementById('pzVoltraScrollTrack');
                const style = track ? getComputedStyle(track) : null;
                return {
                  exists: !!track,
                  left: style?.left,
                  width: style?.width,
                  scrollable: document.scrollingElement.scrollHeight > innerHeight,
                  htmlClass: document.documentElement.classList.contains('playzone-embedded')
                };
              });
              if (!scrollState.exists || scrollState.left !== '2px' || !scrollState.htmlClass) {
                throw new Error('Voltra left scrollbar not active: ' + JSON.stringify(scrollState));
              }

              // Back button must stay internal.
              await page.locator('a.pz-playzone-back').click();
              await page.waitForSelector('#home');

              if (!apiRequests.some(x => x.method === 'PUT')) throw new Error('No PUT action reached mock API');
              if (!apiRequests.some(x => x.method === 'POST' && x.path.includes('/outlets/1/state'))) throw new Error('No power POST reached mock API');
              if (pageErrors.length) throw new Error('Browser errors: ' + pageErrors.join(' | '));

              console.log('VOLTRA_BROWSER_TEST_OK');
              console.log(JSON.stringify(apiRequests.filter(x => x.method !== 'GET'), null, 2));
            } finally {
              await browser.close();
              server.close();
            }
          })().catch(err => {
            console.error(err);
            server.close();
            process.exit(1);
          });
          NODE

          node voltra-browser-test.cjs
