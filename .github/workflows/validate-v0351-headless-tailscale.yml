name: Validate v0.35.1 Bundled Headless Tailscale

on:
  push:
    branches:
      - feature/v0351-bundled-headless-tailscale
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - name: Source and syntax checks
        shell: pwsh
        run: |
          if ((Get-Content VERSION.txt -Raw).Trim() -ne '0.35.1') { throw 'VERSION mismatch.' }

          python -m py_compile backend/app/main.py backend/app/windows_service.py backend/app/tailscale_support.py backend/app/root_setup.py
          node --check frontend/dist/assets/index-v031.js
          node --check desktop-shell/main.js

          foreach ($file in @(
            'Install-PlayZone-Service.ps1',
            'Setup-Tailscale-Support.ps1',
            'Uninstall-PlayZone-Service.ps1'
          )) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($file,[ref]$tokens,[ref]$errors) | Out-Null
            if ($errors.Count -gt 0) { throw "$file syntax error: $($errors[0].Message)" }
          }

          $installer = Get-Content Install-PlayZone-Service.ps1 -Raw
          foreach ($needle in @(
            "tailscale-setup-1.102.4-amd64.msi",
            "TS_NOLAUNCH=1",
            "TS_UNATTENDEDMODE=always",
            "Get-AuthenticodeSignature",
            "Suppress-TailscaleTray",
            "tailscale-ipn",
            "nourxplay v0.35.1"
          )) {
            if (-not $installer.Contains($needle)) { throw "Installer feature missing: $needle" }
          }

          $service = Get-Content backend/app/windows_service.py -Raw
          if (-not $service.Contains('PLAYZONE_TAILSCALE_HEADLESS')) { throw 'Headless service environment missing.' }

      - name: Verify official Tailscale MSI
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force tailscale-runtime | Out-Null
          $msi = 'tailscale-runtime\tailscale-setup-1.102.4-amd64.msi'
          $sha = "$msi.sha256"
          Invoke-WebRequest -UseBasicParsing -Uri 'https://dl.tailscale.com/stable/tailscale-setup-1.102.4-amd64.msi' -OutFile $msi
          Invoke-WebRequest -UseBasicParsing -Uri 'https://dl.tailscale.com/stable/tailscale-setup-1.102.4-amd64.msi.sha256' -OutFile $sha

          $expectedText = (Get-Content $sha -Raw).Trim()
          $match = [regex]::Match($expectedText, '(?i)\b[0-9a-f]{64}\b')
          if (-not $match.Success) { throw 'Official checksum file did not contain SHA256.' }
          $actual = (Get-FileHash $msi -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $match.Value.ToLowerInvariant()) { throw "Tailscale SHA mismatch: $actual" }

          $signature = Get-AuthenticodeSignature $msi
          if ($signature.Status -ne 'Valid') { throw "Tailscale signature status: $($signature.Status)" }
          if (-not ($signature.SignerCertificate.Subject -match 'Tailscale')) { throw "Unexpected signer: $($signature.SignerCertificate.Subject)" }

          Write-Host "TAILSCALE_MSI_SHA256=$actual"
          Write-Host "TAILSCALE_SIGNER=$($signature.SignerCertificate.Subject)"

      - name: Mock headless watchdog behavior
        shell: pwsh
        run: |
          @'
          import os
          import sys
          from pathlib import Path

          sys.path.insert(0, str(Path("backend").resolve()))
          import app.tailscale_support as ts

          os.environ["PLAYZONE_TAILSCALE_HEADLESS"] = "1"
          os.environ["PLAYZONE_REMOTE_SUPPORT_ALWAYS_ON"] = "1"

          class DummyProc:
              returncode = 0
              stdout = ""
              stderr = ""

          calls = []
          ts.subprocess.run = lambda args, **kwargs: calls.append(list(args)) or DummyProc()
          ts._find_tailscale = lambda: r"C:\Program Files\Tailscale\tailscale.exe"

          states = [
              {
                  "supported": True,
                  "installed": True,
                  "connected": True,
                  "needs_login": False,
                  "always_on": False,
                  "serve_active": False,
              }
          ]
          ts.get_status = lambda: dict(states[-1])

          def reconnect():
              calls.append(["RECONNECT"])
              states.append({
                  "supported": True,
                  "installed": True,
                  "connected": True,
                  "needs_login": False,
                  "always_on": True,
                  "serve_active": False,
              })
              return dict(states[-1])

          def enable():
              calls.append(["ENABLE_SERVE"])
              states.append({
                  "supported": True,
                  "installed": True,
                  "connected": True,
                  "needs_login": False,
                  "always_on": True,
                  "serve_active": True,
              })
              return dict(states[-1])

          ts.reconnect = reconnect
          ts.enable_remote_access = enable

          result = ts.ensure_always_on()
          assert ["RECONNECT"] in calls, calls
          assert ["ENABLE_SERVE"] in calls, calls
          assert any(c and c[0].lower().endswith("taskkill.exe") for c in calls if isinstance(c, list)), calls
          assert result["serve_active"] is True
          print("HEADLESS_WATCHDOG_OK")
          '@ | Set-Content validate_headless.py -Encoding UTF8
          python validate_headless.py
