name: Build Mobile Cloudflare Test

on:
  push:
    branches:
      - experiment/cloudflare-mobile-test
    paths:
      - "mobile/android-client/**"
      - ".github/workflows/build-mobile-cloudflare-test.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Prepare Android 35 SDK
        shell: bash
        run: |
          export ANDROID_HOME="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"

      - name: Build debug APK
        run: gradle -p mobile/android-client --no-daemon assembleDebug

      - name: Prepare artifact
        run: |
          mkdir -p out
          cp mobile/android-client/app/build/outputs/apk/debug/app-debug.apk out/abo_aYmAn-Mobile-v0.2-cloudflare-test-debug.apk
          sha256sum out/abo_aYmAn-Mobile-v0.2-cloudflare-test-debug.apk > out/abo_aYmAn-Mobile-v0.2-cloudflare-test-debug.apk.sha256

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: abo_aYmAn-Mobile-v0.2-cloudflare-test
          path: out/*
          if-no-files-found: error
          retention-days: 30
