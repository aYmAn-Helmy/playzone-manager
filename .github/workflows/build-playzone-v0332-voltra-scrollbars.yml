name: Build PlayZone Manager v0.33.2 Voltra Fix

on:
  push:
    branches:
      - build/playzone-v0332-voltra-scrollbars
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate source
        shell: pwsh
        run: |
          python -m py_compile backend/app/main.py backend/app/services.py backend/app/windows_service.py backend/app/embedded_voltra.py backend/voltra_local/dashboard.py
          node --check frontend/dist/assets/index-v031.js
          node --check frontend/dist/playzone-responsive.js
          node --check desktop-shell/main.js

          $backend = Get-Content backend/app/main.py -Raw
          $dashboard = Get-Content backend/voltra_local/dashboard.py -Raw
          $responsive = Get-Content frontend/dist/playzone-responsive.js -Raw
          $responsiveCss = Get-Content frontend/dist/playzone-responsive.css -Raw
          $index = Get-Content frontend/dist/index.html -Raw

          if (-not $dashboard.Contains("const playzoneMode=location.pathname==='/voltra-console'")) { throw 'Native PlayZone Voltra mode missing.' }
          if (-not $dashboard.Contains("localStorage.getItem('playzone_token')")) { throw 'PlayZone token bridge missing.' }
          if (-not $dashboard.Contains("/api/root/voltra-console")) { throw 'Voltra ROOT proxy path missing.' }
          if (-not $dashboard.Contains("#pzVoltraScrollTrack")) { throw 'Voltra left scrollbar missing.' }
          if (-not $responsiveCss.Contains("*:not(html):not(body)::-webkit-scrollbar")) { throw 'Global inner scrollbar skin missing.' }
          if (-not $responsiveCss.Contains("#pz-left-scroll-track")) { throw 'Main left scrollbar missing.' }
          if (-not $index.Contains("033-ui4")) { throw 'UI cache bust missing.' }
          if ((Get-Content VERSION.txt -Raw).Trim() -ne '0.33.2') { throw 'Version must be 0.33.2.' }

          $all = $backend + $dashboard + $responsive + $responsiveCss
          if ($all -match 'abo_aYmAn|abo-ayman-logo') { throw 'Unexpected abo_aYmAn branding.' }
          if (Test-Path backend/app/drinks.py) { throw 'Unexpected drinks module.' }

          $files = @('Install-PlayZone-Service.ps1','Launch-PlayZone.ps1','Uninstall-PlayZone-Service.ps1')
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($file,[ref]$tokens,[ref]$errors) | Out-Null
            if ($errors.Count -gt 0) { throw "$file has PowerShell syntax errors: $($errors[0].Message)" }
          }

      - name: Prepare package
        shell: pwsh
        run: |
          $pkg = Join-Path $PWD 'package'
          New-Item -ItemType Directory -Force -Path $pkg | Out-Null

          foreach ($dir in @('backend','frontend','offline-runtime','desktop-shell','desktop-runtime')) {
            Copy-Item -LiteralPath $dir -Destination (Join-Path $pkg $dir) -Recurse -Force
          }

          $files = @(
            'Bootstrap-Portable.ps1',
            'Install-PlayZone-Service.bat',
            'Install-PlayZone-Service.ps1',
            'Launch-PlayZone.ps1',
            'Uninstall-PlayZone-Service.ps1',
            'Setup-Root-Password.bat',
            'Setup-Root-Password.ps1',
            'Setup-Tailscale-Support.bat',
            'Setup-Tailscale-Support.ps1',
            'REMOTE-SUPPORT-SETUP-AR.txt',
            'TAILSCALE-GRANTS-EXAMPLE.json',
            'PlayStation.ico',
            'README-SERVICE-AR.txt',
            'CHANGES-v0.33-AR.txt',
            'DESKTOP-RUNTIME-AR.txt',
            'VERSION.txt'
          )
          foreach ($file in $files) {
            if (Test-Path -LiteralPath $file) {
              Copy-Item -LiteralPath $file -Destination $pkg -Force
            }
          }

          @'
          PlayZone Manager v0.33.2 - Voltra Controls + Scrollbars Fix
          ==========================================================

          تم اختبار Voltra على Chromium حقيقي:
          - Tabs قابلة للضغط.
          - Rename ينفذ PUT عبر ROOT proxy.
          - تشغيل الطاقة ينفذ POST عبر ROOT proxy.
          - تعطيل المشترك ينفذ POST.
          - PlayZone token يُرسل تلقائياً.
          - لا توجد JavaScript errors أثناء الاختبار.

          Scrollbars:
          - الـPage scrollbar الرئيسي رفيع وموجود على الشمال.
          - نفس شكل الـscrollbar مطبق على أي Scroll داخلي في PlayZone.
          - نفس الشكل مطبق داخل Voltra.
          - صفحة Voltra نفسها لها scrollbar رفيع على الشمال في وضع PlayZone.

          التثبيت:
          1) فك الضغط بالكامل.
          2) شغّل Install-PlayZone-Service.bat كـ Run as administrator.
          3) يفضل Backup قبل التحديث.
          4) الـUpgrade يحافظ على قاعدة البيانات الموجودة.
          '@ | Set-Content -LiteralPath (Join-Path $pkg 'TEST-INSTRUCTIONS-AR.txt') -Encoding UTF8

      - name: Bundle verified Electron runtime
        shell: pwsh
        run: |
          $version = '44.4.5'
          $name = "electron-v$version-win32-x64.zip"
          $url = "https://github.com/electron/electron/releases/download/v$version/$name"
          $expected = '11c395820a5aaa8ebcc0686b476d0ac98a730274ebfbdc8cf5538a7c2815cb5d'
          $dest = Join-Path $PWD "package\desktop-runtime\$name"
          Invoke-WebRequest -UseBasicParsing -Uri $url -OutFile $dest
          $actual = (Get-FileHash -LiteralPath $dest -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw "Electron SHA256 mismatch: $actual" }

      - name: Final package checks
        shell: pwsh
        run: |
          if (Test-Path 'package\backend\app\drinks.py') { throw 'drinks.py unexpectedly packaged.' }
          $bad = Get-ChildItem -LiteralPath package -Recurse -File | Where-Object {
            $_.Name -match 'abo_aYmAn|abo-ayman|abo-addon'
          }
          if ($bad) { throw "Unexpected branded file(s): $($bad.FullName -join ', ')" }

      - name: Create ZIP
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path out | Out-Null
          Compress-Archive -Path package\* -DestinationPath out\PlayZone-Manager-v0.33.2-Voltra-Scrollbars-Fix-Full.zip -CompressionLevel Optimal -Force
          (Get-FileHash out\PlayZone-Manager-v0.33.2-Voltra-Scrollbars-Fix-Full.zip -Algorithm SHA256).Hash.ToLowerInvariant() |
            Set-Content out\PlayZone-Manager-v0.33.2-Voltra-Scrollbars-Fix-Full.zip.sha256 -Encoding ASCII

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: PlayZone-Manager-v0.33.2-Voltra-Scrollbars-Fix-Full
          path: out/*
          if-no-files-found: error
          retention-days: 30
